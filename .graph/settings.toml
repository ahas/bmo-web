repository = "bmo-web"
base = false

[coverage]
# The bmo-next layout reaches every Cargo package's src/ and the console project. These files carry no
# feature: the two crate roots that only list and re-export their modules, the TypeScript declarations
# generated from the OpenAPI document or standing beside it, the console's ambient declarations, and the
# type declarations of a vendored library.
layout = "bmo-next"
unindexed = [
  "server/src/lib.rs",
  "server/client/src/lib.rs",
  "client/packages/server-client/src/schema.ts",
  "client/apps/web/shared/auth.d.ts",
  "client/apps/web/shared/yaml.d.ts",
]
