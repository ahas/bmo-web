# The Cargo workspace: the server, the one Rust project of this repository. The console under client/ is a
# Bun project of its own, with its own manifest and lockfile.
[workspace]
resolver = "3"
members = ["server", "server/client"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

# The registry crates every unit takes at one version and one feature set (bmo-chat's docs/conventions.md,
# 「Shared versions」), copied from its shared-versions.toml.
[workspace.dependencies]
axum = { version = "0.8.9", features = ["macros", "multipart", "ws"] }
reqwest = { version = "0.13.5", features = ["json", "query", "stream"] }
tokio = { version = "1.53.3", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "test-util", "time"] }

# The build output is kept small (bmo-chat's docs/conventions.md, 「Rust builds」): debug information down to line
# numbers beside the objects, no incremental state, and none kept in a test binary or a release.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = false

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"
strip = "debuginfo"
incremental = false

[profile.test.package."*"]
debug = false

[profile.release]
debug = false
strip = "debuginfo"
