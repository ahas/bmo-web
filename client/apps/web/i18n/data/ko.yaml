# Words the console matches on rather than shows (docs/web.md, 「Wording and the language pack」): what another
# unit writes into a text, in every language it writes in, read by name in `shared/text-marks.ts` whatever language
# the reader reads the console in. A code file holds none.

# The marks a message's text opens with where it stands for something other than words. A voice message's
# text is its mark, with the recording's length where one is known, then the words it says. A chat service writes a
# mark in the words of its own policy, which are not this pack's language, and the archive keeps rows written in more
# than one, so each mark that stands for what a message carried lists every word it is written with.
marks:
  voice: ["음성", "Voice"]
  # The mark, followed by a space, that a line the service said as itself opens with in rows the archive kept before
  # such a line was kept as a fixed line, in every language it was written in: read only so such a row is drawn as a
  # system line, its words standing without the mark. The service writes it no more.
  notice: ["[봇 알림]", "[Bot notice]", "[ボット通知]", "[机器人通知]"]
  # What a message carried, as it is marked at the head of its text: a kept file with its name, a kept picture, a
  # sticker kept as its picture, alone or with what it shows after a colon or a space, a kept video or round video
  # note, and a kept sound with its name.
  file: ["파일", "File"]
  picture: ["사진", "Photo"]
  sticker: ["스티커", "Sticker", "Emoticon"]
  video: ["동영상", "Video"]
  video_note: ["동영상 메모", "Video note"]
  audio: ["오디오", "Audio"]
  # What a chat client keeps as the whole text of a line that carried a thing and no words, in no brackets: its
  # label for a picture, for a count of pictures ({n} standing for the number), for a video and for an emoticon,
  # matched whatever the letters' case.
  labels:
    picture: ["사진", "photo"]
    pictures: ["사진 {n}장", "{n} photos"]
    video: ["동영상", "video"]
    sticker: ["이모티콘", "emoticon"]

# The word bmo-job files a co-work branch's span under in the name it stores, ahead of the branch's number.
filed:
  branch: "branch"
