# Translation of server/lang/ko/deployment.yaml; that file says what each line is for.
rollback:
  restart_refused: "Deploy failed: couldn't restart the bot deployed at {commit} with systemctl."
  not_answering: "Deploy failed: the bot deployed at {commit} didn't respond within {seconds}s of restarting."
  died_after_start: "Deploy failed: the bot deployed at {commit} responded but stopped within {seconds}s."
  archive_short: "Deploy failed: {commit}'s migration couldn't bring the PostgreSQL archive into this code's shape.{detail}"
  untouched: "This was before the deploy tree was switched, so neither the service nor the deploy tree changed. The bot is still running the previous code."
  answers: "Rolled back to the previous deploy {to}, and the bot is responding again."
  silent: "Rolled back to the previous deploy {to}, but the bot still isn't responding. The bot is down."
  first: "There's no previously deployed commit, so it couldn't be rolled back."
  before_start: "The pre-start command changed the archive to fit the new code, so it wasn't rolled back automatically. Restoring in docs/deploy.md is the way back."
  tree: "Couldn't roll back the deploy tree: {detail}"
  bot_down: "The bot is down."
  cause: "Cause: {cause}"
  output: "deploy output"
  reason: "Rolled back after a failed deploy: {commit}'s bot didn't come up, so it returned to the previous deploy {back}"

down:
  given_up: "systemd gave up on {unit} after restarting it {restarts} times (retry limit). The bot is off now."
  failed: "{unit} stopped in a failed state ({result}). The bot is off now."
  exit: "Last exit code {status}."
  last_error: "Last error: {line}"
  deploying_unread: "Couldn't read the deployments in progress."
  deploying: "Deployments in progress: {units}"
  look: "Inspect: journalctl --user -u {unit} -n 50 / Restart: systemctl --user restart {unit}"

suite:
  refused_unread: "The hand deployment couldn't read main, so nothing went live."
  refused: "Refused the hand deployment of {main}, so nothing went live. Commits closed by Jobs are waiting for deployment ({waiting}), and main goes live with them through bmo deploy backlog."
  check_failed: "The hand deployment of {main} didn't pass the static check, so nothing went live."
  suite_failed: "The hand deployment of {main} didn't pass the test suite, so nothing went live.{files}"
  files: " Broken files: {files}."
  failed: "The hand deployment of {main} didn't finish (exit code {code}). What stopped where is in the deploy unit's journal."
  locked: "Refused the hand deployment, so nothing went live. Another deployment is running; start it again once that one ends."

backlog:
  item: "item #{item}"
  no_item: "no item"
  running: "{count} Jobs ({jobs}) are running, so"
  running_unread: "Couldn't read what is running, so"
  passing: " {count} Jobs ({jobs}) are not waited for."
  waiting_gap: "{taken} {running} it starts no new Jobs and waits for them to finish before going live. At most {minutes} min.{passing} The console's deploy-wait band shows what it is waiting for."
  hold_released: "Released the deploy wait by hand: nothing went live and the queue moved again. The {count} pending commits keep waiting and go live again when no Job runs."
  gap_missed: "Waited {minutes} min for Jobs to finish to put live a batch that takes away what old code still uses, but {running} nothing went live and the deploy wait was released. The {count} pending commits keep waiting."
  gap_missed_unread: "what is running could never be read, so"
  gap_missed_running: "{count} Jobs are still running, so"
  batch_failed: "Before putting the {count} pending commits live together, {broke} nothing went live: {commits}.{files}"
  check_broke: "the static check broke, so"
  suite_unstarted: "the suite couldn't start some files, so"
  suite_broke: "the suite broke, so"
  broken_files: " Broken files: {files}."
  batch_cut: "Before putting the {count} pending commits live together, {broke} the commits were halved down, and the first breaking commit is {first}. Only the {ahead} commits before it go live; {held} keep waiting.{files}"
  first_job: "Job #{job}"
  first_broke: " It breaks from the first commit, {first}."
  cut_broke: "checking again only up to the first breaking commit still broke, so"
  main_ahead: "No commits are waiting for deployment, but main ({head}) has {count} commits past the live commit: {commits}{more}. They aren't on the waiting list, so bmo deploy backlog won't put them live; use bmo deploy main --then '<why>'."
  main_ahead_more: " and {count} more"
  not_contained: "Of the pending commits, {commits} aren't on main ({head}), so nothing went live. The commits keep waiting."
  deploy_failed: "The deployment of the {count} pending commits didn't finish (exit code {code}). The commits keep waiting; what stopped where is in the deploy unit's journal."
  deployed: "{count} pending commits went live{items}."
  deployed_items: " (items {items})"
  still_waiting: " {commits}, which came in after this deployment read main, still wait, and the same run's next round puts them live."
  still_waiting_last: " {commits}, which came in after this deployment read main, still wait, and this run's {rounds} rounds are all done, so run bmo deploy backlog again."
  warnings:
    counted: " Check warnings: {build} build, {test} test{before}."
    before: " (last deploy: {build} build, {test} test)"
    unrecorded: " (no previous deploy record to compare)"
    new: " {count} new warnings not seen in recent deploys:\n{lines}"
    more: "- {count} more"
    seen: " Every added warning was already seen in recent deploys."
  bot_down_owner: "Deploy on hold: the bot isn't up, so the {count} pending commits didn't go live ({why}). The commits keep waiting. Bot status: systemctl --user status {unit}"
  bot_down: "The bot isn't up ({why}), so the {count} pending commits didn't go live. The commits keep waiting; once the bot is back up, run bmo deploy backlog again."
  taken:
    breaks_unread: "couldn't read whether the commits that move the archive's shape ({commits}) take away what old code reads, and"
    breaks: "the commits that move the archive's shape ({commits}) take away what old code reads ({breaks}), and"
    moved_unread: "couldn't read whether the batch deletes or moves code files, and"
    moved: "the batch deletes or moves code files that processes started earlier can still import ({files}), and"
  gap:
    breaks_unread: "couldn't read whether the commits that move the archive's shape take away what old runners read"
    breaks_every_runner: "the commits that move the archive's shape take away what every runner reads"
    moved_unread: "couldn't read the code files the batch deletes or moves"
    processes_unread: "couldn't read which release's code the Job's processes read"
    pinned: "the Job is pinned to release {release}, so it keeps reading its own code even when the deploy tree moves"
    reach_unread: "the Job ({place}) isn't pinned to a release, and couldn't read what the deploy tree scripts runners and Jobs use call"
    reaches: "the Job ({place}) isn't pinned to a release, and the deploy tree scripts runners and Jobs use can call {files}"
    reaches_none: "the Job ({place}) isn't pinned to a release, but the deploy tree scripts runners and Jobs use don't call the files taken away"
