# Translation of server/lang/ko/dev-servers.yaml; that file says what each line is for.
server:
  no_worker: "There is no worker named {worker}."
  not_up: "{worker}'s dev server isn't running."
  not_down: "{worker}'s dev server (process group {group}) didn't go down within {seconds}s. Log: {log}"
  down: "Stopped {worker}'s dev server."
  no_command: "Worker {worker} has no dev server command."
  no_job: "No Job is running on worker {worker}, so the dev server isn't started. A dev server runs only while a Job runs."
  already_up: "{worker}'s dev server is already running (process group {group}). Read its output at {log}."
  not_up_in_time: "The new dev server didn't come up within {seconds}s. Log: {log}"
  up: "{done} {worker}'s dev server (process group {group}). Ask the server itself whether it's ready, and read its output at {log}."
  started: "Started"
  restarted: "Restarted"

listing:
  head: "Worker dev servers (lifetime {minutes} min)"
  worker: "- {worker}: group {group}, {minutes} min up, {megabytes} MB, {job}{expired}"
  job_running: "Job running"
  no_job: "No Job running"
  expired: ", past lifetime"
  left_head: "Servers left by Jobs"
  none: "- None"
  total: "Total: {count}, {megabytes} MB"
  nothing_to_end: "No servers to end."

pane:
  head: "Dev server · {worker}\nWorkbench: {workbench}\nLog: {log}"
  leftover: "A previous dev server (process group {group}) is left over; ending it."
  start: "Start: {command}  ({cwd})"
  ended: "The dev server ended (code {code}). Restarting in {seconds}s{quick}."
  quick: " (quick exit #{count})"
  job_over: "The Job is over, so"
  not_asked: "The Job asked to stop the dev server, so"
  no_command: "There's no dev server command or the worker is resting, so"
  closing: "{why} closing this pane."
  stopping: "{why} stopping the dev server."
  expired: "The dev server passed its lifetime ({minutes} min), so stopping it and closing this pane. It starts again if the Job needs it."
  idle: "The dev server went unused for {minutes} min{short}, so stopping it and closing this pane. It starts again if the Job needs it."
  short: " while memory is short"
  restarting: "Restarting the dev server as requested."
  moved: "The dev server command or work path changed; restarting."
  starting_now: "Starting the dev server now as requested."
  pane_closed: "The pane closed; stopping the dev server."
