# Translated from server/lang/ko/job-questions.yaml; its comments say what each value is.
wait:
  minutes: "{count} min"
  seconds: "{count} sec"
asked:
  lead: "{owner}, something came up while working on item #{item} that I shouldn't decide alone, so I'm asking."
  removed_room: "This came from room {room}, whose registration was deleted, so I'm asking here instead."
  option: "{number}. {recommended}{option}"
  recommended: "(recommended) "
  why: "Why I'm asking: {why}"
  answer: "Reply with a number. If there's no answer within {wait}, I'll go with the recommended {number}."
  answer_talk: "Reply with a number. If you ask what an option means or say something else, the Job doing this work answers you itself, and I'll stop the clock while you talk. If I hear nothing within {wait}, I'll go with the recommended {number}."
  talk_held: "Clock stopped. The Job on item #{item} will read this and answer. Reply with a number once it's settled."
  job_says: "Job on item #{item}:"
  revised: "I changed the options to these."
  answer_more: "Reply with a number. You can keep talking too; if I hear nothing for {wait}, I'll go with the recommended {number}."
  chosen: "Item #{item}: going with your choice. {named}"
  typed: "Item #{item}: going with what you said. {answer}"
  talk_lapsed: "{owner}, we were talking over the question on item #{item} and I heard nothing for {wait}, so I went with the recommendation. {named}"
  stop_lapsed: "{owner}, the question on item #{item} sat paused with no answer for {wait}, so I went with the recommendation. {named}"
  lapsed: "{owner}, the question on item #{item} got no answer for {wait}, so I went with the recommendation. {named}"
pane:
  allow: "Allow: run the command on screen as it is"
  refuse: "Refuse: don't run it, and tell the Job to redo it safely"
  close: "Close: close the window and tell the Job"
  leave: "Leave it: answer in Herdr yourself"
  permission: "{mark} The Job stopped at a confirmation asking whether it may run this command."
  unknown: "{mark} The Job's pane stopped at a window waiting for a person's answer."
  unknown_text: "This reading doesn't know what window it is. The screen at that moment is kept in the run log."
  why: "The command touches something outside the Job's own workspace, or the runner couldn't judge it, so the runner won't answer alone"
  lead: "{owner}, the Job on item #{item} stopped at a confirmation in its pane."
  withdrawn: "The confirmation on item #{item} closed before you answered (answered in Herdr, or the run ended), so I'm withdrawing the question."
  own_work: "The command stays inside the Job's own workspace, so the runner allows it without asking"
  answered_in_pane: "The confirmation closed before an answer"
