# Translated from server/lang/ko/job-wait.yaml; its comments say what each value is.
usage: |-
  usage: bmo job wait --todo <id> --what '<what you wait on>' (--unit <unit> | --pid <pid>) --until <40m|2h|14:30>
         bmo job wait --todo <id> --what '<what you wait on>' --until <40m|2h|14:30> -- <command…>
         bmo job wait --todo <id> --clear
what: "say what the job waits on: --what '<what you wait on>'."
target: "name the one thing whose life says the wait goes on: --unit <unit> or --pid <pid>, or run the command after --."
