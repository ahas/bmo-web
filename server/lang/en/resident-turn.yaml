# Translated from server/lang/ko/resident-turn.yaml; its comments say what each value is.
notes:
  title: "{title} · {model} · attempt {attempt}"
  trust_written: "Marked this folder ({cwd}) as trusted in Claude Code settings {config}"
  trust_unwritten: "Couldn't mark this folder ({cwd}) as trusted in Claude Code settings {config}: {why}"
  trusted_folder: "Answered trust to the prompt asking whether to trust a folder opened for the first time"
  person_turn: "Waiting for a turn a person put in from Herdr to end"
  stand_again: "{why}, starting the program again and putting this turn in once more"
  untrusted: "The folder trust prompt wouldn't go past"
  not_ready: "The program didn't become ready for input"
  not_taken: "The program didn't take the words put in"
  herdr_silent_ready: "Herdr didn't answer questions about the pane for the whole ready time, so the turn ends as Herdr not responding"
  enter_pressed: "The words put in stayed on the input line unsubmitted, so Enter was pressed once"
  unsubmitted: "The words put in weren't submitted even with Enter, so this turn ends"
  overrun_unasked: "There was no answer from where to ask about a turn past its time limit, so it is cut at the limit: {why}"
  herdr_silent: "Herdr isn't answering questions about the pane, so waiting while reading the record ({cause})"
  herdr_gave_up: "Herdr didn't answer questions about the pane for {seconds} seconds, so the turn ends as Herdr not responding"
  herdr_back: "Herdr answered again after {seconds} seconds. The pane is {state}"
  quiet: "The program is idle and the record hasn't grown for {seconds} seconds, so the round is read as ended. Counted from the record: {queued} waiting, {owed} turns owed, {ended} turns ended"
  error_menu: "After the turn ended on the program's error, a menu to pick what to do next was up, so it was closed with Esc"
screens:
  vanished: "The pane disappeared before it was ready. The screen at that moment"
  not_ready: "The program didn't become ready for input within the ready time. The screen at that moment"
  not_taken: "The program didn't take the words put in ({code}: {message}). The screen at that moment"
  unsubmitted: "The screen the pane stood at with the words put in unsubmitted"
  stopped: "The turn was stopped from outside. The screen at that moment"
  overran: "The turn didn't end within the time given. The screen at that moment"
  silent: "The turn wrote no answer to the record. The screen at that moment"
  unknown_window: "Stopped at a window this reading doesn't know. The screen at that moment\n\n{screen}"
confirm:
  mark: "[Confirmation]"
  left_to_person: "Leaving the confirmation for a person to answer"
  no_allow: "Couldn't find where to allow on the screen, so the confirmation is left to a person"
  allowed: "Answered the confirmation with allow"
  refused_with_reason: "Answered the confirmation with refuse and sent the reason with it"
  refused: "Answered the confirmation with refuse"
  closed: "Closed the confirmation"
  tries: "The confirmation is still there after {tries} answers, so it is left to a person"
  again: "The confirmation is still there after the answer, so the same answer is put in again"
  answered: "The confirmation took the answer and closed"
  changed: "The window's question had changed by the time the answer came, so the answer wasn't put in"
  repeated: "A confirmation already answered in this turn came up again, so it is answered with the answer given then"
  closed_early: "The confirmation closed before it took an answer"
  stopped_at: "Stopped at a confirmation: {question}"
  unasked: "Couldn't ask about the confirmation, so it is left to a person: {why}"
