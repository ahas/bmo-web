# Translated from server/lang/ko/running-report.yaml; its comments say what each value is.
sections:
  deployment: "[Deployment]"
  machine: "[Machine]"
  testbed: "[Testbed]"
  nodes: "[Node assignment]"
  switches: "[Switches]"
  runs: "[Runs]"
  unheld_watches: "[Watches without a runner]"
  rooms: "[Rooms]"
  workers: "[Workers]"
  pending: "[Commits to go live]"
  orders: "[Work orders]"
  questions: "[Questions awaiting an answer]"
span:
  seconds: "{seconds}s"
  minutes: "{minutes}m"
  hours: "{hours}h {minutes}m"
  ago: "{span} ago"
  after: "in {span}"
  elapsed: "for {span}"
kinds:
  gate: "Gate"
  runner: "Runner"
  editor: "Editor"
  worker: "Job"
execution:
  line: "Execution {id}: {provider} · {model} · attempt {attempt} · {state}{shared} · parent {parent} · started from {root}"
  no_model: "no model recorded"
  requested: "requested"
  unknown: "current state needs checking"
  shared_pane: " · shares parent pane"
  no_parent: "none"
unreachable:
  no_token: "There's no control API token (BMO_CONTROL_TOKEN)"
  bot: "The bot isn't answering ({error}). Gates, context folding and answering rooms live only in the bot's memory and can't be known; the runs below were checked against the record, systemd and Herdr."
  herdr: "Couldn't ask Herdr ({error}). The panes' agent state is empty."
nodes:
  machine: "{label}: {jobs} Jobs · {runs} heavy runs · {room}"
  free: "has room"
  held: "on hold: {held}"
  next: "Next heavy run: {next}"
  next_here: "this machine (no node to send to)"
testbed:
  nobody: "nobody holds it"
  holder: "Held by: {entry}"
  waiting: "Waiting {at}: {entry}"
  job: "{place} Job #{job}"
  todo: " (#{todo})"
  joiner: " · "
  minutes: " · for {minutes} min"
  front: " · deployment first"
  kept: " · place kept for a returning Job"
  narrow: "Narrow lane ({width} threads):"
machine:
  joiner: " · "
  load: "load {load} ({threads} threads)"
  pressure: "memory pressure {full}"
  pressure_unread: "unreadable"
  available: "available memory {available}/{total}GB"
  swap: "free swap {free}/{total}GB"
  disk: "free disk {free}GB"
  jobs: "{jobs} Jobs ({browsers} with a browser)"
  free: "has room"
  held: "launches on hold: {reasons}"
  reasons_joiner: ", "
  unread: "couldn't read the machine · {jobs} · {verdict}"
  here: "this machine"
  holds:
    pressure: "memory pressure {full}% ≥ {limit}%"
    available: "available memory {available}GB < {limit}GB"
    load: "load {load} ≥ {threads} threads × {limit}"
    disk: "free disk {free}GB < {limit}GB"
    jobs: "{jobs} Jobs running ≥ {limit}"
    browser_jobs: "{jobs} Jobs with a browser ≥ {limit}"
    node_down: "node {label} disconnected"
  alerts:
    pressure: "This machine's memory pressure (full) has stood at {full}% for {minutes} min, over the alert line of {alert}%. {machine}.{holders}"
    disk: "Free space on the data root's disk is {free}GB, under the {limit}GB needed to launch Jobs. New Jobs wait until space comes back. {machine}."
    herdr: "Herdr didn't answer {count} calls ({methods}) in time. {machine}.{holders}"
    herdr_method: "{method} ×{count}"
    methods_joiner: ", "
  holders:
    line: " Holding the most memory: {holders}."
    joiner: "; "
    holder: "{who} {size}{browsers}"
    job: "Job #{job}{todo} {place}"
    todo: "(item #{todo})"
    browsers: ", {browsers} browsers"
deployment:
  unread: "Couldn't ask systemd, so running deployments and deployments cut off midway couldn't be read."
  unit: "- Deploying: {unit} · journalctl --user -u {unit} --no-pager"
  step: "  - {step}: waited {waited}s · ran {ran}s{code}"
  step_code: " · exit code {code}"
  cut: "A deployment was cut off midway. The deploy tree was laid down at {commit} “{subject}” {ago}, but the bot hasn't started since, so it {bot}."
  bot_old: "is running the earlier code"
  bot_down: "is stopped"
  cut_ahead: "A deployment was cut off midway. The deploy tree's code is ahead of the archive."
  schema: "Archive schema version {stored} · version the deploy tree's code needs {needs}. The deploy tree's scripts can't open the archive."
  redeploy: "To finish: {tree}/bin/bmo deploy commit --commit {commit} --then '<why>' (lays down the same commit again and starts the bot on it)"
  backlog: "To finish: {tree}/bin/bmo deploy backlog ({pending} still waiting, not cleared, so running it again takes them all the way live)."
  backlog_unread: "the backlog commits are"
  backlog_count: "{count} backlog commits are"
hold:
  line: "{commits} · {takes}{waiting}{passing} · for {since}, at most {left} more (no new Jobs launch. If the deploy run died midway, running bmo deploy backlog again releases it)"
  commits_unread: "couldn't read the commits"
  takes_unread: "couldn't read whether it removes what the old code reads"
  takes: "removes: {breaks}"
  waiting_unread: "couldn't read the running Jobs"
  waiting_none: "no Jobs to wait for, restarting soon"
  waiting: "waiting on {count} Jobs: {jobs}"
  passing: " · {count} Jobs not waited for: {jobs}"
switches:
  queue: "Auto-advance: {state}"
  queue_paused: "paused ({owner})"
  queue_on: "on"
  hold: "Deployment hold: {state}"
  hold_none: "none"
  keepalive: "Keepalive: {state}"
  keepalive_stopped: "stopped"
  keepalive_on: "on"
model:
  fallback: "(fallback)"
  changed: "(model changed)"
runs:
  none: "Nothing is running."
  cap: " / cap {cap}"
  stop: "stop {target}"
  activity: "last activity {ago}"
  wait: "waiting: {wait}"
  wait_until: "{what} · {target} · until {clock}"
  wait_overdue: "{what} · {target} · past {clock}"
  wait_unit: "unit {name}"
  wait_pid: "pid {pid}"
  deploy_waits: "deployment waits on this Job"
  pane: "pane {agent} {status}"
  pane_agent_unknown: "agent unknown"
  pane_status_unknown: "state unknown"
  pane_blocked: "blocked · waiting at a confirmation"
died:
  research: "{agent} runner run #{run}{search} died without writing its end. It stood {minutes} min, unit {unit}. The row was closed as died."
  search: " (research #{search})"
watch:
  timer: "timer"
  between_runs: "waiting for the next check runner"
  head: "Watch #{id} · {room} · {name} · {memory}"
  no_memory: "no memory"
  memory: "memory #{id}"
  note_whole: "  Note:"
  note: "  Note {note}"
  moment: "  At {clock}{left}"
  condition: "  Condition {condition}"
  interval: "  every {interval}s · until {deadline} · {last}"
  unchecked: "not checked yet"
  checked: "last checked {ago} · {outcome}"
  timed_out: "timed out"
  met: "met"
  unmet: "not met (exit {code})"
rooms:
  none: "No room is folding context or answering."
  folding: "- {room} folding context · {elapsed}"
  answering: "- {room} {speaker}answering · {messages} messages · {instructions} instructions · {elapsed}"
  stop: " · stop {target}"
  unnamed: "Room {id}"
workers:
  free: "free"
  holds: "Holds: {holds}"
  order: "Work order #{id}"
  lock: "Job lock (no open Job row)"
  job: "{worker}'s Job {job} ({item}) {unit}"
  item: "Item #{id}"
  itemless: "No item{purpose}"
pending:
  none: "No commits waiting to deploy."
  ahead: "No commits waiting to deploy, but main is {count} commits ahead of the live commit. They aren't on the waiting list, so bmo deploy backlog won't take them live; take them live with bmo deploy main --then '<why>'."
  ahead_commit: "- {commit} “{subject}”"
  ahead_unread: "Couldn't read whether main is ahead of the live commit."
  urgent: "A commit has to go live now. Its schema is ahead of the deployed one, so the checkout's scripts can't open the archive."
orders:
  none: "No work orders in progress or stopped."
  closing: "closing"
  no_worker: "no worker"
  stage: " stage {stage}/{stages}{title}"
  stage_title: " “{title}”"
  skipped: " · {count} skipped"
  error: "  Why it stopped: {error}"
  holding: "  Why it holds the checkout: {holding}"
  place: "  Queue place: {place}"
  attempt: "attempt {attempt}"
  status:
    draft: "Draft"
    active: "In progress"
    paused: "Paused"
    done: "Done"
  phase:
    planning: "Design"
    research: "Research and verification"
    synthesis: "Synthesis"
    implementation: "Implementation"
    finalization: "Wrap-up"
  task:
    pending: "Waiting"
    running: "Running"
    done: "Done"
    failed: "Failed"
    skipped: "Skipped"
questions:
  none: "No questions waiting."
  paused: "countdown paused"
  due: "due in {left}"
  overdue: "past due"
