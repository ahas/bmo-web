# The default secret kinds the migrations seed once each (docs/accounts.md, 「Secret kinds」): each kind's name and
# description, and each field's label, under the kind's key and the field's key in lower snake case. From then on a
# kind is the owner's to change on the console, and its lines are read no more.
kinds:
  # A key or a token of one service, one masked line.
  api_key:
    name: "API key"
    description: "An API key or token for one service"
    fields:
      # The key or token itself.
      api_key: "API key"
  # A sign-in to an account, its user name and its password.
  account_login:
    name: "Account login"
    description: "User name and password"
    fields:
      # The name the account signs in as.
      username: "User name"
      # The account's password.
      password: "Password"
  # An AWS access key, with the region it is used in.
  aws_access_key:
    name: "AWS access key"
    description: "Access key ID, secret access key, region"
    fields:
      # The access key's id.
      aws_access_key_id: "Access key ID"
      # The access key's secret.
      aws_secret_access_key: "Secret access key"
      # The region the key is used in.
      aws_region: "Region"
  # An OAuth client, its id and its secret.
  oauth_client:
    name: "OAuth client"
    description: "Client ID and client secret"
    fields:
      # The client's id.
      client_id: "Client ID"
      # The client's secret.
      client_secret: "Client secret"
  # A connection to a database.
  database:
    name: "Database connection"
    description: "Host, port, user, password, database"
    fields:
      # The host the database server answers on.
      db_host: "Host"
      # The port it answers on.
      db_port: "Port"
      # The user it is signed in to as.
      db_user: "User"
      # That user's password.
      db_password: "Password"
      # The database's name on the server.
      db_name: "Database"
  # An SSH private key, pasted as several lines or read from a file.
  ssh_private_key:
    name: "SSH private key"
    description: "A private key pasted as several lines or loaded from a file"
    fields:
      # The private key itself.
      ssh_private_key: "Private key"
  # A file kept whole, such as a certificate or a service account's JSON.
  file:
    name: "File"
    description: "A file such as a certificate or a service account JSON"
    fields:
      # The file itself.
      file: "File"
  # A payment card, its number and its CVC masked.
  card:
    name: "Card"
    description: "Card number, expiry date, CVC, cardholder name"
    fields:
      # The number on the card's face.
      card_number: "Card number"
      # The month and year the card is good until.
      card_expiry: "Expiry date"
      # The security code on the card's back.
      card_cvc: "CVC"
      # The name the card is issued in.
      card_holder_name: "Cardholder name"
  # Where a parcel is sent: who takes it, how they are reached, and the address.
  delivery_address:
    name: "Delivery address"
    description: "Recipient, phone number, postal code, address, address line 2"
    fields:
      # The person the parcel is for.
      recipient: "Recipient"
      # The number the courier calls.
      phone: "Phone number"
      # The postal code.
      postal_code: "Postal code"
      # The street address.
      address: "Address"
      # The building, floor or unit after the street address.
      address_detail: "Address line 2"
