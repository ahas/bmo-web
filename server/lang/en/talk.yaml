# What the console shows of a talk the owner has with the chat agent about an item, a document or a code review
# (docs/web.md), said alike by the bun bot's talk routes and `bmo-server`'s where each answers them.

# A second word while the first is still being answered.
busy: "{chat_agent_subject} is still answering your previous message."

# Why a turn came back with nothing, shown under the unanswered line: the chat agent resting, the usage limit, the API
# not answering, a turn that said nothing, and any other.
unanswered:
  resting: "{chat_agent_subject} is resting, so this message wasn't answered."
  limit: "The usage limit was reached, so this message wasn't answered."
  outage: "The API didn't respond, so this message wasn't answered."
  silent: "{chat_agent_subject} said nothing in reply to this message."
  other: "No answer came for this message."

# The code review: a row filed while the chat agent still answers in its thread, and one for a {worker} the catalogue no
# longer has.
code_review:
  answering: "{chat_agent_subject} is still answering in this review. You can file it once the answer arrives."
  worker_gone: "The {worker} worker no longer exists, so it can't be filed."

# The document viewer: a seek the gate left unanswered, and why a document's translation stopped short — the
# translator gave no answer, the translation was stopped, or its part could not be written.
seek_unanswered: "The document seek gate didn't answer."
translation:
  unanswered: "The translator didn't answer."
  stopped: "The translation was stopped."
  unwritten: "The translation couldn't be written."
