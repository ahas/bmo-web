  check_broke: "静的検査が壊れたため、"
  suite_unstarted: "スイートが一部のファイルを開始できなかったため、"
  suite_broke: "スイートが壊れたため、"
  broken_files: " 壊れたファイル: {files}。"
  batch_cut: "保留中のコミット {count} 件をまとめて上げる前に{broke}コミットを半分ずつ絞り込んだところ、最初に壊れるコミットは {first} だ。その前のコミット {ahead} 件だけを別に上げ、{held} はそのまま待つ。{files}"
