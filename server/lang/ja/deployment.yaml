  cause: "原因: {cause}"
  output: "デプロイ出力"
  reason: "デプロイ失敗によるロールバック: {commit} のボットが起動しなかったため、以前のデプロイ {back} に戻った"

down:
  given_up: "systemd が {unit} を {restarts} 回再起動したすえに諦めました (再試行上限)。ボットは現在停止しています。"
  failed: "{unit} が失敗状態で停止しました ({result})。ボットは現在停止しています。"
  exit: "最後の終了コード {status}。"
  last_error: "最後のエラー: {line}"
