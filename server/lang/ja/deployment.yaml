  hold_released: "デプロイ待ちを手動で解除し、何も上げずにキューを再び動かした。保留中のコミット {count} 件はそのまま待ち、Job がないときに再び上げる。"
  gap_missed: "古いコードがまだ使うものを取り除くバッチを上げるため {minutes} 分間 Job の終了を待ったが、{running}何も上げずにデプロイ待ちを解除した。保留中のコミット {count} 件はそのまま待つ。"
  gap_missed_unread: "何が実行中か最後まで読み取れなかったため、"
  gap_missed_running: "Job {count} 件がまだ実行中のため、"
