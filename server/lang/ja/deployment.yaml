  deploying: "進行中のデプロイ: {units}"
  look: "確認: journalctl --user -u {unit} -n 50 / 再起動: systemctl --user restart {unit}"

suite:
  refused_unread: "手動のデプロイが main を読み取れず、何も上げなかった。"
  refused: "手動の {main} デプロイを拒否し、何も上げなかった。Job が閉じたコミットがデプロイを待っており ({waiting})、main は bmo deploy backlog でそれらと一緒に上がる。"
  check_failed: "手動の {main} デプロイが静的検査を通らず、何も上げなかった。"
  suite_failed: "手動の {main} デプロイがテストスイートを通らず、何も上げなかった。{files}"
  files: " 壊れたファイル: {files}。"
  failed: "手動の {main} デプロイが完了しなかった (終了コード {code})。何がどこで止まったかはデプロイユニットのジャーナルにある。"
  locked: "手動のデプロイを拒否し、何も上げなかった。別のデプロイが実行中なので、それが終わってからもう一度かける必要がある。"

backlog:
  item: "項目 #{item}"
  no_item: "項目なし"
  running: "Job {count} 件 ({jobs}) が実行中のため、"
  running_unread: "何が実行中か読み取れないため、"
