# Translation of server/lang/ko/dev-servers.yaml; that file says what each line is for.
server:
  no_worker: "{worker} というワーカーはありません。"
  not_up: "{worker} の開発サーバーは起動していません。"
  not_down: "{seconds} 秒以内に {worker} の開発サーバー (プロセスグループ {group}) が停止しませんでした。ログ: {log}"
  down: "{worker} の開発サーバーを停止しました。"
  no_command: "{worker} ワーカーには開発サーバーのコマンドがありません。"
  no_job: "{worker} ワーカーで実行中の Job がないため、開発サーバーを起動しません。開発サーバーは Job の実行中だけ起動します。"
  already_up: "{worker} の開発サーバーはすでに起動しています (プロセスグループ {group})。出力は {log} で確認してください。"
  not_up_in_time: "{seconds} 秒以内に新しい開発サーバーが起動しませんでした。ログ: {log}"
  up: "{worker} の開発サーバーを{done} (プロセスグループ {group})。準備ができたかはサーバーに直接確認し、出力は {log} で確認してください。"
  started: "起動しました"
  restarted: "再起動しました"

listing:
  head: "ワーカーの開発サーバー (寿命 {minutes} 分)"
  worker: "- {worker}: グループ {group}、{minutes} 分経過、{megabytes} MB、{job}{expired}"
  job_running: "Job 実行中"
  no_job: "実行中の Job なし"
  expired: "、寿命超過"
  left_head: "Job が残したサーバー"
  none: "- なし"
  total: "合計: {count} 個、{megabytes} MB"
  nothing_to_end: "終了するサーバーはありません。"

pane:
  head: "開発サーバー · {worker}\n作業台: {workbench}\nログ: {log}"
  leftover: "以前の開発サーバー (プロセスグループ {group}) が残っているため終了します。"
  start: "開始: {command}  ({cwd})"
  ended: "開発サーバーが終了しました (コード {code})。{seconds} 秒後に再起動します{quick}。"
  quick: " (すぐに終了したのは {count} 回目です)"
  job_over: "Job が終わったため、"
  not_asked: "Job が開発サーバーの停止を求めたため、"
  no_command: "開発サーバーのコマンドがないか、ワーカーが休止中のため、"
  closing: "{why}このペインを閉じます。"
  stopping: "{why}開発サーバーを停止します。"
  expired: "開発サーバーが寿命 ({minutes} 分) を過ぎたため、停止してこのペインを閉じます。Job が再び使うときは再起動します。"
  idle: "{short}開発サーバーが {minutes} 分間使われていないため、停止してこのペインを閉じます。Job が再び使うときは再起動します。"
  short: "メモリが不足しているうえ、"
  restarting: "要求を受けて開発サーバーを再起動します。"
  moved: "開発サーバーのコマンドか作業パスが変わったため、再起動します。"
  starting_now: "要求を受けて開発サーバーをすぐに起動します。"
  pane_closed: "ペインが閉じられたため、開発サーバーを停止します。"
