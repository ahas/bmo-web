# Translated from server/lang/ko/job-questions.yaml; its comments say what each value is.
wait:
  minutes: "{count}分"
  seconds: "{count}秒"
asked:
  lead: "{owner}、項目 #{item} をやってて、ひとりで決めちゃいけなさそうなことがあるから聞くね。"
  removed_room: "登録が削除されたルーム {room} から来た仕事だから、そのルームの代わりにここで聞くね。"
  option: "{number}. {recommended}{option}"
  recommended: "(おすすめ) "
  why: "聞く理由: {why}"
  answer: "番号で答えて。{wait}以内に答えがなかったら、おすすめの {number} 番で進めるね。"
  answer_talk: "番号で答えて。選択肢の意味を聞いたり別の意見を言ったりしたら、この仕事をしている Job が直接答えるよ。話している間は時計を止めておくね。{wait}以内に何もなかったら、おすすめの {number} 番で進めるね。"
  talk_held: "時計を止めたよ。項目 #{item} の Job が読んで答えるね。決まったら番号で答えて。"
  job_says: "項目 #{item} の Job:"
  revised: "選択肢をこう変えたよ。"
  answer_more: "番号で答えて。もっと話してもいいよ。{wait}の間何もなかったら、おすすめの {number} 番で進めるね。"
  chosen: "項目 #{item}、選んでくれたとおりに進めるね。{named}"
  typed: "項目 #{item}、言ってくれたとおりに進めるね。{answer}"
  talk_lapsed: "{owner}、項目 #{item} で聞いたことを話してる途中で {wait} の間何もなかったから、おすすめで決めたよ。{named}"
  stop_lapsed: "{owner}、項目 #{item} で聞いたことを止めたまま {wait} の間答えがなかったから、おすすめで決めたよ。{named}"
  lapsed: "{owner}、項目 #{item} で聞いたことに {wait} の間答えがなかったから、おすすめで決めたよ。{named}"
pane:
  allow: "許可: 画面のコマンドをそのまま実行する"
  refuse: "拒否: 実行せず、Job に安全にやり直すよう伝える"
  close: "閉じる: ウィンドウを閉じて Job に伝える"
  leave: "そのままにする: Herdr で直接答える"
  permission: "{mark} Job がこのコマンドを実行してよいか確認するウィンドウで止まったよ。"
  unknown: "{mark} Job のペインが人の答えを待つウィンドウで止まったよ。"
  unknown_text: "どんなウィンドウかはこの読み取りではわからない。そのときの画面は実行ログに残してあるよ。"
  why: "Job 自身の作業スペースの外に触れるか、ランナーが判断できなかったコマンドなので、ランナーはひとりで答えない"
  lead: "{owner}、項目 #{item} の Job がペインの確認ウィンドウで止まったよ。"
  withdrawn: "項目 #{item} の確認ウィンドウが答える前に閉じた (Herdr で直接答えたか、実行が終わった) から、この質問は取り下げるね。"
  own_work: "Job 自身の作業スペースの中だけで動くコマンドなので、ランナーが聞かずに許可します"
  answered_in_pane: "答える前に確認ウィンドウが閉じた"
