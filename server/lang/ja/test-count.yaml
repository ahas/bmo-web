# What `bmo test count` prints (docs/deploy.md, 「The test count」): the tests the checkout holds, and with
# `--since` the TypeScript tests the range removed, each accounted for or not. Each `{name}` is filled in
# with what it names.

# The tests the checkout holds, by language.
tree: "TypeScript テスト {typescript} 件、Rust テスト {rust} 件"
# The range from {since}: the changed test files' tests {before} and {after}, and the {removed} it removed.
range: "{since} 以降に変更されたテストファイル: テスト {before} 件 → {after} 件、削除したテスト {removed} 件"
# One test removed, by its {file} and {title}.
removed: "  削除: {file} · {title}"
# One test removed that nothing accounts for.
open: "代替も廃止理由もなく削除: {file} · {title}"
