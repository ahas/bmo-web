# The answers and refusals of the TODO verbs (docs/todo.md) as a person or the chat agent reads them; run inside
# a job, the same verbs answer in the worker's English, written beside where each line is said. Each
# `{name}` is filled in with what it names: {id} and {title} an item's, {selector} what was named.

# A resume condition put with a hold that cannot stand.
condition:
  both: "--after と --after-deploy は同時に指定できません。保留の再開条件は 1 つです"
  after: "--after にはまだ終わっていない別の項目を指定してください。#{id}は{why}です"
  after_itself: "この項目自身"
  after_finished: "すでに終了した項目"
  no_commits: "#{id}にはデプロイを待つコミットがありません。先にその作業を閉じてコミットをデプロイ待ちにするか、コミットを直接指定してください（--after-deploy <コミット>）"
  not_commit: "--after-deploy {selector}: このリポジトリのコミットではありません"
  not_on_main: "--after-deploy {selector}: main にないコミットのため、デプロイしてもライブになりません"
  live: "--after-deploy {selector}: すでにライブのコミットです"

# The words added to an item: none, those taken back ({count} of them, each by its {note} number, its
# {author}, who took it back {by} and when {at}), and one taken back now by its {note} number.
notes:
  none: "todo: #{id} '{title}' 追記なし"
  withdrawn: "取り消したメモ {count} 件:"
  withdrawn_note: "- メモ {note}（{author}が追記、{by}が {at} に取り消し）"
  removed: "todo: #{id} '{title}' メモ {note} を取り消しました。どの Job にも載りません"
  removed_delivered: "todo: #{id} '{title}' メモ {note} を取り消しました。このメモを含む{chat_agent}の修正内容はすでに実行中の Job に伝わっているため、その Job にはそのまま残ります"

# An item rewritten: the parts named by what was {changed}.
edit:
  nothing: "--edit には直す箇所を 1 つ以上指定してください: --title、--what、--do、--conclusion、--judgement、--intent、--order のいずれか。"
  title: "タイトル"
  intent: "作業指示書の目的"
  order: "作業指示書の指示"
  done: "todo: #{id} '{title}' を書き直しました: {changed}"

# The queue's switches: auto-progress paused or resumed, and the deployment's {hold} standing or let go.
queue:
  paused: "todo: 自動進行を一時停止しました。{chat_agent}にキューが待っていることを知らせません。実行中の Job と段階は最後まで進みます。"
  resumed: "todo: 自動進行を再開しました。{chat_agent}にキューの状況を知らせます。"
  hold_stands: "todo: デプロイ待ちはそのまま残っています: {hold}。この待ちは再開では解除されず、解除するのは --release-deploy-hold です。"
  no_hold: "todo: デプロイ待ちはありません。"
  hold_released: "todo: デプロイ待ちを解除しました: {hold}。デプロイは何もライブにせずに退き、コミットはそのまま待ちます。"

# An item set aside, stopped, wound down or left where its run stopped, and a hold let go: with its
# {reason}, the {runs} asked to stop, the {job} told to stop at its stage, the {note} left and the {held}
# word it stays under.
hold:
  after: "--hold は --after を受け付けません。項目の完了を待つ保留は --wind-down <id> --why '<理由>' --after <項目 id> です"
  held: "todo: #{id} '{title}' を保留しました。キューはもう取り上げません{reason}"
  stop_why: "todo: --stop には --why '<理由>' が必要です"
  stopped: "todo: #{id} '{title}' を停止しました。実行 {runs} 件に停止を要求し、項目は停止として保留されました（{reason}）。保留を解除すると中断したところから続きます"
  wind_down_why: "--wind-down には --why '<理由>' が必要です"
  wound_down: "todo: #{id} '{title}' 再開待ち。{told}。理由: {reason}"
  wound_down_idle: "実行中の Job がないため、保留だけを設定しました"
  wound_down_running: "実行中の Job {job}に、今の段階まで終えて止まるよう伝えます"
  stop_here_report: "--stop-here は --report '<終えたこと・続きの場所>' を受け付けます"
  stop_here_closed: "#{id} '{title}' は終了したか別の項目に統合されたため、止めておけません"
  stopped_here: "todo: #{id} '{title}' の停止地点を残しました（メモ {note}）。完了として閉じず、{held}のままにします{reason}"
  job_unhold: "Job は保留を解除しません"
  unheld: "todo: #{id} '{title}' の保留を解除しました。優先度 {priority} の順番に戻りました"

# Items merged into the item {into} and taken out again, with its {priority}; {target} is the merge target
# named with its subject particle.
merge:
  usage: "--merge は統合する項目番号と --into <番号> を受け付けます。番号はカンマで区切ります。"
  merged: "todo: {ids} → #{into} '{title}' に統合しました。キューはもう取り上げず、{target}が完了すると一緒に完了します"
  unmerged: "todo: #{id} '{title}' の統合を解除しました。優先度 {priority} の元の項目に戻りました"

# An item closed or opened again: what the closing wrote, the items finished with it ({ids}), a the chat agent's share
# strand handed to the chat agent as the memory {memory} with its {head}, an item waiting on it whose condition the
# closing met, and on opening again the merge it leaves ({into}), the items merged again and the notes it
# came out of opened again ({ids}).
close:
  resolve_why: "--resolve は --why で、なぜもう未決事項でないのかを受け付けます。"
  report: "報告"
  unfinished: "未決事項"
  written: "（{parts}を記入）"
  written_joint: "・"
  carried: "（統合された項目も一緒に完了: {ids}）"
  handed: "todo: {chat_agent}の担当の未決事項を{chat_agent}に引き渡しました。記憶 #{memory}: {head}"
  resumable: "todo: #{id} '{title}' の再開条件（#{after} の終了）が満たされたため、{chat_agent}に知らせました。保留は{chat_agent_subject}が解除します"
  reopened: "待機"
  reopened_unmerged: "（#{into} への統合から外れました）"
  reopened_merged: "（統合された項目を再び統合: {ids}）"
  reopened_sources: "（出典の未決事項を再オープン: {ids}）"
  # The section a closing puts on the report over what the live-Claude guard kept, and its line for one
  # opening: its {at} number, what it was for {purpose} and how many {runs} it let through.
  live_claude_heading: "実測記録（ガードが残したもの）"
  # The resolution a 미결 gets once every row it was broken into is finished, naming those {rows}.
  settled: "この未決事項から立てた行がすべて完了したため解消しました: {rows}。"
  # The word an item is named by in an instruction that names it by its number.
  item_word: "項目"
  # The report an item merged into the {target} is closed with when that item is.
  merged_report: "#{target}に統合され、一緒に完了しました。どう対応したかは #{target}の完了報告にあります。"
  live_claude_line: "{at}. {purpose}: 実際の Claude 実行 {runs} 回"

# The item's settings: its state line, its {worker} (and the base it is a {support} worker of), the
# {target} it repairs as the {round} of {rounds} repairs of the item {root}, its co-work, its impact grounds
# (read or refused for {why}, the nodes whose outward contract changes counted as {contracts}, a new home
# marked, the {verdict} they come to beside the {cowork} setting the item stands at; a job's own grounds
# kept quietly, or kept and told to the chat agent for the {reason} that they differ or that the chat agent filed none), its
# priority and its job {model}.
settings:
  mark_status: "--mark は --status で記入する状態 1 行を受け付けます。"
  worker_usage: "--worker は項目の後にワーカー名を 1 つ受け付けます。割り当てを外すには - を指定してください。"
  worker_support: "{worker}は{base}の追加支援ワーカーです。項目は{base}に割り当て、どのチェックアウトで動くかは実行が選びます。"
  worker_cleared: "todo: #{id} '{title}' のワーカー割り当てを解除しました。Built-in ワーカーが担当します"
  worker_set: "todo: #{id} '{title}' はワーカー {worker}が担当します"
  repairs_with_add: "--repairs は受付と同時には使えません。先に --add で受け付け、表示された番号で --repairs <修正する項目番号> <対象番号> を指定してください。"
  repairs_usage: "--repairs は項目の後に修正対象の番号を 1 つ受け付けます。リンクを外すには - を指定してください。"
  repairs_cleared: "todo: #{id} '{title}' の修正対象とのリンクを解除しました"
  repairs_set: "todo: #{id} '{title}' が #{target}を修正します（#{root}の修正作業 {round}/{rounds} 回目）"
  cowork_usage: "--cowork は項目の後に on または off を受け付けます。"
  cowork_on: "todo: #{id} '{title}' を協業で実行します"
  cowork_off: "todo: #{id} '{title}' の協業をオフにしました。1 セッションで実行します"
  impact_usage: "影響の根拠は JSON 1 つで受け付けます（{why}）: {\"nodes\":[{\"id\":\"<グラフのノード id>\",\"contract\":\"<変わる外部契約>\" または null}],\"new_home\":<新しい配置先を決める必要があれば true>}"
  impact_set: "todo: #{id} '{title}' の影響の根拠を記入しました。外部契約が変わるノード {contracts} 件{new_home}、判定は{verdict}、協業設定は{cowork}です"
  impact_new_home: "、新しい配置先が必要"
  impact_single: "単一 Job"
  impact_cowork: "協業"
  impact_on: "オン"
  impact_off: "オフ"
  impact_check_kept: "todo: #{id} Job が改めて洗い出した影響の根拠を記入しました。判定が協業設定と同じなので{chat_agent}には知らせません"
  impact_check_told: "todo: #{id} Job が改めて洗い出した影響の根拠を記入し、{chat_agent}に知らせました（{reason}）。協業設定は{chat_agent_subject}が変更し、この Job は開始したとおり続けます"
  impact_check_differs: "判定は{verdict}だが協業設定は{cowork}"
  impact_check_unfiled: "項目に{chat_agent}の影響の根拠がない"
  priority_usage: "--priority は項目の後に数値を 1 つ受け付けます。"
  model_needed: "--model auto または明示的なモデルが必要です。"
  model_set: "todo: #{id} モデル {model}"
  model_wrong: "正しくない作業モデルです。"
  no_verb: "どの動詞かわかりません。このスクリプトは上の動詞を 1 つ受け付けます。"

# Filing a row: a raised row short of its title or its room, and a filing short of the {missing} parts named,
# the reply named by its {reply_part}; a row filed as {id} with its {title}, its {cowork} mark and the head of
# the message that asked for it {clip}; a row raised on the chat agent's judgement out of the work of the item {item},
# out of the strands of {sources}, each by its {id} and {strand}, with its {cowork} mark and the notes it
# opened again {ids}; and a title or summary that uses a term set aside, the {terms} named.
add:
  judgement_needs: "--judgement で立てる項目には --title が必要で、--chat かこのマシンの設定でルーム番号を指定する必要があります。"
  missing: "--add に{missing}がないか、空です。項目はこれらの部分で構成されるため、1 つでも空なら行を書き込みません。"
  reply_part: "--reply または --reply-text"
  filed: "todo: added #{id} '{title}': 決裁待ち{cowork}、承認されるとキューに入ります（{clip}）"
  raised: "todo: added #{id} '{title}': {chat_agent}の判断で起票（項目 #{item}の作業{sources}）、{chat_agent}の承認待ち{cowork}{reopened}"
  raised_sources: "、出典の未決事項 {sources}"
  raised_source: "#{id}の {strand}番"
  raised_reopened: "（出典の未決事項を再オープン: {ids}）"
  cowork: "、協業"
  wording: "タイトルと要約に使わないことにした言葉があるため、何も書き込みませんでした: {terms}（WORDING.md）。書き換えてもう一度実行してください。"

# Words added to an item: none given; told to the chat agent, who folds them into the brief; the chat agent's own, kept as
# the record its --brief folds in; and the account of the fact the chat agent is told, of the words {by} added to the item
# {id} {title}, with no job at work on it or with the running {job}.
append:
  empty: "--append は項目に言葉を書き足すので、言葉が必要です: --text '<言葉>'、または stdin で渡してください"
  told: "todo: #{id} '{title}' にメモを追記しました。{chat_agent}に知らせ、{chat_agent_subject}が指示に整理して反映します"
  own: "todo: #{id} '{title}' にメモを追記しました。記録として残ります。指示には --brief で反映し、変わった点を記入します"
  fact_idle: "#{id} {title}に{by}のメモが追記された。その項目で実行中の Job はない。"
  fact_running: "#{id} {title}に{by}のメモが追記された。Job {job}がその項目を作業中。"

# the chat agent's rewrite of an item's brief: refused to anyone but the chat agent, with no change named, with no brief on
# stdin and with either not in English; written with no job running, or with the change handed to the running {job}.
brief:
  not_bmo: "--brief は{chat_agent}だけが書きます。追加したいことは --append で書けば、{chat_agent_subject}が指示に整理して反映します"
  no_change: "--brief は何が変わったかを英語で一緒に受け付けます: --change '<what changed>'"
  empty: "--brief は新しい指示の全文を stdin で受け付けます"
  not_english: "指示と変わった点は、ワーカーが読む英語で書きます。{owner}の言葉は ```text フェンスの中にそのまま置きます"
  idle: "todo: #{id} '{title}' の指示を修正しました。実行中の Job がないため、次の Job が新しい指示で始まります"
  running: "todo: #{id} '{title}' の指示を修正しました。実行中の Job {job}には、変わった点だけが報告の前に伝わります"

# An approval that carried the owner's word.
approve:
  noted: "（意見も記入）"
# A wind-down: its resume condition said as a reason, waiting on the item {id} to finish or on {what} going
# live; the note the run it interrupts is handed, opening with the wind-down {mark}, the {why} the owner gave,
# how it {resume}s and the {verb} with the item {id} it closes with; and the mark the note a run leaves where it
# stopped opens with.
wind_down:
  finished: "#{id} の終了後に再開"
  deployed: "{what} のデプロイ後に再開"
  resume_plain: "再開は{chat_agent_subject}が保留を解除したとき"
  resume_condition: "再開は条件（{condition}）が満たされ、{chat_agent_subject}が保留を解除したとき"
  note: |-
    {mark} {owner}の指示により、この項目はここまでで止める（{why}）。{resume}。
    今の段階だけを終え、新しい段階・学習・ユニットは立ち上げない。この実行が立ち上げたユニット・プロセスは残さない。
    コミットすべきものはコミットし、リポジトリのやり方で閉じたうえで、
    項目は完了として閉じない: {verb} --stop-here {id} --report '<終えたこと・続きの場所>'
    --done はこの項目を拒否する。
  stopped_here_mark: "[停止地点]"
  # A held or stopped reason written in English by a person, which the screens show as written.
  reason_korean: "理由は韓国語で書いてください。保留の理由はコンソールと一覧に書いたとおりに表示されます。"
# The whole usage `bmo todo --help` prints, every verb with its flags.
usage: |-
  usage: bmo todo --add --title '<title>' --what '<what the work is>' --do '<what has to be done>' --conclusion '<conclusion>' --instruction <messageId>[,<messageId>] [--reply <messageId>[,<messageId>]] [--reply-text '<text>'] [--chat <chatId>] [--requester '<name>'] [--fasttrack <tool>] [--model <model>] [--status '<text>'] [--cowork] [--impact '<grounds JSON>']
         bmo todo --add --title '<title>' --judgement '<the chat agent's judgement>' --from-todo <id>:<strand>[,<id>:<strand>] --raised-by <id> [--chat <chatId>] [--model <model>] [--status '<text>'] [--cowork] [--impact '<grounds JSON>']
         bmo todo --list [--all] [--pending] [--held] [--merged] [--chat <chatId>]
         bmo todo --show <id|title>
         bmo todo --set-model <id> --model <auto|model>
         bmo todo --notes <id|title>
         bmo todo --append <id|title> [--text '<words to add>'] [--by '<who>']   (stdin without --text)
         bmo todo --unappend <id|title> --note-id <note number> [--by '<who>']   (--notes prints the note numbers)
         bmo todo --brief <id|title> --change '<what changed, in English>'   (the whole new brief in English on stdin; chat the chat agent's alone, and a running job is handed only the change)
         bmo todo --edit <id|title> [--title '<title>'] [--what '<...>'] [--do '<...>'] [--conclusion '<...>'] [--judgement '<...>'] [--intent '<work order purpose>'] [--order '<work order instruction>']   (only an item not finished and with no job running; the conversation's originals cannot be changed)
         bmo todo --done <id|title> [--report '<how the work was done>'] [--unfinished '<what was left as 未決事項>'] | --reopen <id|title>
         bmo todo --resolve <id> --why '<what makes it no longer 未決事項>'
         bmo todo --mark <id|title> --status '<text>'
         bmo todo --approve <id> [--note '<the owner's further word or question>'] | --unapprove <id>
         bmo todo --hold <id|title> [--why '<why it waits>'] [--after-deploy <item id|commit>] | --unhold <id|title>   (--hold lets the running turn finish; --unhold is never a job's)
         bmo todo --stop <id|title> --why '<reason>'   (stops the running job and its co-workers now and holds the item as stopped; finished stages stay)
         bmo todo --wind-down <id|title> --why '<reason>' [--after <item id> | --after-deploy <item id|commit>]   (stop at the end of the current stage: held as 再開待ち and told to the running job at once)
                  (a condition releases nothing: when the --after item finishes, or the item's waiting commits or the commit go live, the chat agent is told and takes the hold off)
         bmo todo --stop-here <id|title> [--why '<reason>' [--after <item id> | --after-deploy <item id|commit>]] --report '<what is finished and where the next run picks up>'   (leaves where a wound-down or stopped item's job stopped; the item stays open and held. A job told in words to stop puts its own item at 再開待ち with --why)
         bmo todo --merge <id>[,<id>] --into <id> | --unmerge <id|title>   (the merged items are finished when the item they merged into is)
         bmo todo --worker <id|title> <worker name | ->
         bmo todo --repairs <id|title> <id of the item it repairs | ->   (this item was filed to repair the other's failure; repairs chain in one line, up to 3)
         bmo todo --cowork <id|title> <on|off>
         bmo todo --impact <id|title> '<grounds JSON>'   (the parts of the code the change reaches and the outward contract that changes on each; docs/todo.md)
         bmo todo --impact-check <id|title> '<grounds JSON>'   (a job's own grounds, weighed again before it changes anything; the chat agent is told where they come to another verdict than the co-work setting)
         bmo todo --priority <id|title> <n>
         bmo todo --drop <id>
         bmo todo --pause | --resume   (the whole queue's automatic progress; the owner's pause only)
         bmo todo --release-deploy-hold   (releases by hand the wait a deployment put on while a job ends; the deployment backs off without putting anything live)
