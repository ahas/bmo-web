# What a game of 끝말잇기 says in the room and what its start and stop answer the chat agent with
# (docs/word-chain.md), said alike by the bun bot and bmo-server.

# What a game says in the room, in the chat agent's voice, and what its start and stop answer the chat agent with.
# Each `{name}` is filled in with what it names: {word} a word as played, {topic} a word quoted with its
# topic particle, {openings} the syllables a word may start with and the particle after them, {name} a
# player's name and {subject} a name with its subject particle. The particles are chosen by the code
# saying the line, by the sound a word ends on.
lines:
  # A game's name: the first players' {shown} names, and the {rest} counted.
  game: "[{shown} の対戦]"
  game_more: "[{shown} ほか{rest}人の対戦]"
  game_joint: "·"
  # Why a word the asker gave cannot open a game.
  opening_not_in_book: "{topic} 辞書にないので"
  opening_loanword: "{topic} 外来語なので"
  opening_no_follower: "{topic} 続けられる単語がないので"
  # The asker asked for another opening word, the one that could not open it said {unusable}.
  ask_again: "{unusable} お題には使えないよ。{name}、別のお題をちょうだい。もらえたら始めるね。"
  ask_again_bare: "{unusable} お題には使えないよ。別の単語をちょうだい。"
  ask_first: "{name}、まずは対戦を始めるお題をちょうだい。「スタート 子犬」みたいに単語を付けてもいいよ。"
  no_opening: "お題がもらえなかったので、しりとりはやめておくね。"
  folded: "しりとりはやめておくね。"
  # The call for players: its rules, how to join, the {seconds} until it starts, and its opening word.
  call: "しりとり参加者募集!"
  call_join: "「参加」と"
  call_join_named: "募集中の対戦が複数あるので「参加 {name}」のようにこの対戦の人の名前を付けて"
  call_how: "{how}打てば参加できるよ。{seconds}秒後か、参加者が「スタート」と言ったら始めるね。"
  call_opening: "お題は {openings} にするね。"
  call_moves: "自分の番が来たら単語だけ打ってね。「棄権」で棄権、「しりとりやめ」でゲーム終了だよ。"
  rule_joint: " · "
  rule_nouns: "名詞のみ"
  rule_loanwords_on: "外来語OK"
  rule_loanwords_off: "外来語禁止"
  rule_manner_on: "とどめ単語禁止"
  rule_manner_off: "とどめ単語OK"
  rule_no_limit: "時間制限なし ({minutes}分間誰も打たなければ終了)"
  rule_limit: "1手 {seconds}秒"
  rule_robot: "{agent}も参加 ({difficulty})"
  # A move refused, and why.
  off_chain: "{topic} つながらないよ。{openings} 始まる単語をちょうだい。"
  not_in_book: "{topic} 辞書にないよ。"
  loanword: "{topic} 外来語なので今回はダメだよ。"
  used: "{topic} もう出たよ。"
  manner: "{topic} とどめ単語なので今回はダメだよ。"
  # What happens in a game: a player joins with {count} in it, a round starts in an {order}, a turn with
  # its {limit}, a word taken for its {points}, what a word means, a player out ({by} scoring the 한방 its
  # {points}), and the end with each {place} of the ranking and its {score} and {words}.
  joined: "{name} 参加 ({count}人)"
  started: "スタート! 順番: {order}"
  order_joint: " → "
  first_word: "お題: {word}"
  new_word: "新しいお題: {word}"
  meaning: "{word}: {meaning}"
  turn: "{name} の番: {openings} 始まる単語{limit}"
  turn_limit: " · {seconds}秒"
  taken: "いいね、{word} (+{points})"
  taken_robot: "{name}: {word} (+{points})"
  timeout: "時間切れ! {name} 脱落。"
  hanbang: "とどめ! {openings} 始まる単語がないので {name} 脱落。{by}"
  hanbang_by: " ({name} +{points})"
  gave_up: "{name} 棄権。"
  stuck: "{subject} 続く単語を見つけられなかったよ。{name} 脱落。"
  nobody: "誰も参加しなかったので、しりとりはやめておくね。"
  stopped: "しりとりを止めたよ。ここまでのスコア:"
  idle: "{minutes}分間誰も打たなかったので、しりとりはやめておくね。ここまでのスコア:"
  decided: "ゲーム終了! 最終順位:"
  ranking: "{place}位 {name} {score}点 (単語 {words}個)"
  # Where a word to a game could be for several standing ones: which to pick with the {verb} it was said
  # for, the word to say and an {example} of it.
  pick: "{verb}対戦を選んでね: {games}。「{word} {example}」のように対戦にいる人の名前を付ければいいよ。"
  pick_stop: "止める"
  pick_join: "参加する"
  pick_stop_word: "しりとりやめ"
  pick_join_word: "参加"

  # The robot's difficulty as the call names it.
  difficulty:
    easy: "やさしい"
    normal: "ふつう"
    hard: "むずかしい"

# What starting and stopping a game answer the chat agent with: the word book missing at its {path}, a
# {subject} already in a {game} of the room, an opening word {unusable}, a game opened in the room {chat}
# with {more} standing beside it, or none to stop.
answers:
  no_book: "単語辞書がインストールされていません: {path} (bmo word-chain install)"
  in_game: "{subject} すでにこのルームの {game} に参加しています。"
  unusable: "{unusable} 対戦を始められません。別のお題を受け取ってから、もう一度始めてください。"
  asked_again: "{unusable} ルームで {name} に別のお題をお願いしました。使える単語が届いたら対戦を始めます。"
  opened: "しりとりを始めました: ルーム {chat}、参加者募集中。{more}"
  opened_more: " このルームで進行中の対戦は {count}件です。"
  none: "このルームで進行中のしりとりはありません。"
  several: "このルームには対戦が {count}件あります: {games}。止めるよう頼んだ人を player に指定してください。"
  not_theirs: "その人が参加しているしりとりの対戦はこのルームにありません。"
  # The bot asked to start or stop a game from a shell not answering at all, with {why}, or answering the
  # {status} of a request it did not take.
  unreached: "ボットが応答しません ({why})"
  not_taken: "ボットがリクエストを受け付けませんでした (HTTP {status})。"

# What the word book's own verbs answer: the book installed with its {count} words at its {path} out of its
# {source} at its {commit} under its {licence}, the {count} meanings read into it out of theirs, and a {word}
# looked up — absent, or present with whether it is a {loanword}, the {openings} it hands on and how many
# {count} words follow, and its {meaning}, a basic word's or a hard one's.
book:
  installed: "単語 {count}個を {path} にインストールしました ({source} @ {commit}, {licence})。"
  meanings: "語釈 {count}件を追加しました ({source} @ {commit}, {licence})。"
  absent: "「{word}」: 辞書になし"
  found: "「{word}」: あり{loanword} · {openings} 続く単語 {count}個"
  loanword: " (外来語)"
  basic: "基礎語: {meaning}"
  hard: "難しい語: {meaning}"
