# The words a running job's line is said in wherever a person reads it (docs/jobs.md, 「The item is the only
# number」): the item it is a run of, and the step a work order is at (docs/work-orders.md, 「What a step is
# called」). Each `{name}` is filled in with what it names.

# A job's line names its item as {id}.
item: "項目 #{id}"
# A run of an item past its first: {item} is the item's line above, {attempt} which run of it this is.
attempt: "{item} · {attempt}回目の実行"
# A job with no item behind it, where its launcher wrote no line for why it was launched.
itemless: "項目のない作業"

# A work order's round past the first, {round}, ahead of the step's name.
round: "{round}次"

# Each step of a work order by its name. Only a build step is followed by which of how many it is.
steps:
  # The plan turn.
  plan: "計画"
  # A stage that finds things out.
  investigate: "調査"
  # A stage that checks a finding or the plan.
  review: "レビュー"
  # The synthesis turn, which writes the build list.
  synthesis: "設計の統合"
  # A build step.
  build: "実装"
  # The final turn.
  final: "最終検証"
