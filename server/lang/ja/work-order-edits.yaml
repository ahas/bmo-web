  control: "計画・統合・最終ターンはステップ動詞では変更しません。作業指示書を途中で終えるには --close を使います。"
  finished: "終了した作業指示書です。再実行するには --reopen で開きます。"
  draft: "まだ実行前の下書きです。"
  closing: "終了処理中の作業指示書です。チェックアウトに開いた変更を取り下げて完了した後、--reopen で開きます。"
  instruction_size: "タスクの指示は1〜30000字で入力します。"
  model_tier: "モデルの等級は {tiers} のいずれかです。"
  coworker_tier: "コワーカーの等級は {tiers} のいずれかです。{worker_only} 等級はコワーカーとして借りません。"
  history_edit: "前の回のタスクは変更しません。"
  history_rerun: "前の回のタスクは再実行しません。前の回からやり直すには作業指示書を開き直します。"
  history_restore: "前の回のタスクは元に戻しません。前の回からやり直すには作業指示書を開き直します。"
  running_edit: "実行中のタスクの保存済み指示を変えても、すでに始まった実行には伝わりません。実行中のものに言葉を加えるには bmo todo --append {item} で追記します。"
