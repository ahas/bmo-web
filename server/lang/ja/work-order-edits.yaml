  stage_running: "現在のステージに実行中のタスクがあるため、ステージを戻しません。"
  build_running: "実行中の実装タスクがある間は受け付けません。"
  research_over: "調査フェーズが終わった後は調査ステージを再実行しません。調査からやり直すには作業指示書を開き直します。"
  phase: "現在のフェーズではこのタスクを再実行しません。"
  running: "タスク {task} は実行中です。"
  pending: "タスク {task} はすでに待機中です。"
  not_skipped: "タスク {task} はスキップされていません。"
  same_anchor: "同じタスクを基準にして移動しません。"
  add_anchor: "新しいタスクは待機中の実装タスクの前か後ろにだけ置きます。"
  build_move: "実装タスクは両方が待機中のときだけ移動します。"
