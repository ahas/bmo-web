  recover_no_builder: "その範囲に、前の実行の目的と指示を読み取れる builder ターンがありません。"

# The control route's verbs on a work order and an item: a stopped order's place in its line, a body
# field by its {name}, runs asked to stop that are still {alive}, a result document already at its {path}.
orders:
  paused: "TODO #{item} の作業指示書は一時停止しています。そのワーカーの列で順番が来るとボットが自動で再開します。今すぐ再開するには bmo work-order --todo {item} --resume を使います。"
  not_text: "{name} の値は文字列です。"
  missing: "{name} の値が必要です。"
  still_running: "実行の停止を要求しましたが、まだ終了が確認されていません: {alive}"
  document_there: "{path} に結果ドキュメントがすでにあるため、上書きしません。"
  reopen_done: "完了した作業指示書だけを開き直します。"
  draft_only: "実行前の下書きだけを編集できます。"
  order_and_model: "作業指示書とモデルを確認してください。"
  approved_only: "承認済みで進行可能な TODO だけを実行します。"
  active: "TODO #{item}: 保存されたステップがすでに進行中です。"
  done: "完了した作業指示書は再実行しません。前の結果を活かして再実行するには bmo work-order --todo {item} --reopen で開きます。"
  model: "作業モデルが正しくありません。"
  chat: "chatId が正しくありません。"
  not_checkout: "{cwd} は git リポジトリではないため、協業を実行しません。"
  not_checkout_run: "{cwd} は git リポジトリではないため、協業を実行しません。協業なしの通常の Job として実行してください。"
  item_number: "TODO 番号が正しくありません。"
  no_item: "TODO がありません。"
  resume_held: "承認済みで、保留・マージされていない中断作業だけを再開します。"
  resume_paused: "中断された作業だけを再開できます。"
  before_after: "before と after のどちらか一方だけを記入します。"
  checkout_done: "完了した作業指示書のチェックアウトは、その作業がどこで行われたかの記録なので変更しません。"
  job_range: "Job 番号の範囲は <最初の Job>-<最後の Job> で記入します。"
  action: "正しくない操作です。"
  stop_done: "完了した項目は停止しません。"

# The work order script's own flags, and a bot it could not reach to stop an item or edit an order: the
# {flag} lacking a value, the {verbs} named together, the {error} the call gave and the {status} the bot
# answered with.
script:
  value: "{flag} の後に値が必要です。"
  verbs: "一度に使える動詞は1つだけです: {verbs}"
  recover: "--recover は <最初の Job>-<最後の Job> で記入します。"
  stop_no_token: "ボットの control API トークン (BMO_CONTROL_TOKEN) がないため、停止しませんでした。"
  stop_unreachable: "ボットが応答しないため、停止しませんでした。ボットが起動しているときにもう一度呼び出します。({error})"
  stop_refused: "ボットが停止を受け付けませんでした (HTTP {status})。"
  edit_no_token: "ボットの control API トークン (BMO_CONTROL_TOKEN) がないため、作業指示書を変更しませんでした。"
  edit_unreachable: "ボットが応答しないため、作業指示書を変更しませんでした。ボットが起動しているときにもう一度呼び出します。({error})"
  edit_refused: "ボットがリクエストを受け付けませんでした (HTTP {status})。"
