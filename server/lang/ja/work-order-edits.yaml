  close_reason: "終了の理由を1〜2000字で記入します。"
  close_builder: "実行中の builder ターンがあるため終了しません。やめさせるには bmo todo --stop {item} --why '<理由>' で項目を停止します。"
  recover_done: "終了した作業指示書だけを復元します。ランナーが保持している作業指示書では、復元した記録はランナーの保存で上書きされます。"
