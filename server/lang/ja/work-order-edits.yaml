  skip_reason: "スキップする理由を1〜2000字で記入します。"
  skipped_already: "タスク {task} はすでにスキップ済みです。"
  running_builder: "実行中の builder ターンはここでは止めません。やめさせるには bmo todo --stop {item} --why '<理由>' で項目を停止します。"
