# What `bmo worker fold` says of the job workers' sessions it folds after a prefix change (docs/deploy.md,
# docs/agent-control.md): each line under its head, what it leaves alone and why, what it would fold, what
# became of each fold, and the run's last line. Each `{name}` is filled in with what it names: {name} a
# session's worker and model, {session} its id, {count} how many.

# Every line the verb prints opens with this, {line} the rest of it.
line: "折りたたみ: {line}"

# A session left as it stands: no prefix word on its row, or a prefix that has not moved.
untouched:
  no_record: "{name}: プレフィックスの記録がないためそのままにしました (--all で折りたためます)"
  same: "{name}: プレフィックスが変わっていないため折りたたむものがありません"

# With --dry-run, a session that would be folded.
due: "{name}: {session} を折りたたむところでした"

# What became of one fold, after the session's {name}.
outcomes:
  compacted: "{name}: 折りたたみました"
  too_short: "{name}: 蓄積が少なく、要約器が折りたたむものはないと判断しました"
  busy: "{name}: Job がそのチェックアウトのロックを保持しているためスキップしました"
  failed: "{name}: 折りたためませんでした"

# The run's last line: nothing found, {count} sessions with each outcome counted, and the {count} left
# standing because their prefix had not moved.
tally:
  none: "折りたたむセッションはありませんでした"
  sessions: "セッション {count}件: {parts}"
  part: "{word} {count}件"
  left: "プレフィックスそのまま {count}件"
  due: "セッション {count}件を折りたたむところでした"
  words:
    compacted: "折りたたみ"
    too_short: "対象なし"
    busy: "スキップ"
    failed: "失敗"
