# What a companion's settings are refused with and how the companion verb prints them
# (docs/companions.md, 「Its settings」), said alike by the bun bot and bmo-server.

# Why a companion's settings were not saved, as the owner is told it: an {agent} that is no companion,
# a generation setting given wrong or by a {name} that is none, a reference switch, an own piece by a {name} that may not be used (beside the built-in {pieces}) or with a text
# outside its {most} characters, pieces outside the {offered} ones, twice or none, a persona longer than
# {most}, a registration with no address, and a thinking switch given wrong.
refusals:
  not_companion: "대화 상대가 아닙니다: {agent}"
  generation_pairs: "생성 파라미터는 이름과 값의 짝이어야 합니다."
  not_generation: "생성 파라미터가 아닙니다: {name}"
  reference: "참조 주입은 켬 또는 끔이어야 합니다."
  own_pairs: "자기 조각은 이름과 글의 짝이어야 합니다."
  own_name: "자기 조각 이름 {name}은(는) 쓸 수 없습니다: 영문 소문자로 시작하는 소문자·숫자·하이픈 40자 이내이고, {pieces}와 겹치지 않아야 합니다."
  own_size: "자기 조각 {name}의 글은 1~{most}자여야 합니다."
  pieces: "조각은 {offered} 가운데에서 고릅니다."
  pieces_twice: "같은 조각을 두 번 넣을 수 없습니다."
  pieces_none: "시스템 프롬프트에는 조각이 하나 이상 있어야 합니다."
  persona: "페르소나는 {most}자 이내의 글이어야 합니다."
  registration: "주소가 있는 등록 모델을 고릅니다."
  thinking: "생각은 켬, 끔 또는 기본이어야 합니다."
  # Why a room's session of a companion is reset once its generation settings are saved.
  reset_reason: "생성 파라미터 저장"

# A companion's settings as the companion script prints them to the owner, line by line: its {label}
# and {agent}, its {model} and the {file} its engine serves, its base prompt, pieces,
# reference switch, thinking and each generation setting, each
# own piece by {name} with its {text}, its persona of {count} characters, the system prompt it sends
# ({count} characters, its {hash}), each room's session by its {room}, {generation} and when its system
# prompt changed ({at}), and each change by {at}, {by}, {field}, {before} and {after}.
view:
  usage: "usage: bmo companion settings <에이전트> [--db <아카이브>]\n       [--reference on|off] [--pieces <조각,…>|default] [--persona-stdin | --persona-default]\n       [--own-piece <이름> --piece-stdin] [--drop-piece <이름>] [--model <등록 모델>]\n       [--thinking on|off|default] [--<생성 파라미터> <수>|on|off|default …]\n       생성 파라미터: {settings}"
  on: "켬"
  off: "끔"
  default: "기본"
  head: "{label} ({agent})"
  model: "  모델 {model}{serving}"
  serving: " · 엔진이 서빙 중인 파일 {file}"
  base_prompt: "  기본 프롬프트 {prompt}"
  no_base_prompt: "없음"
  pieces: "  시스템 프롬프트 조각 {pieces}"
  reference: "  참조 주입 {state}"
  generation: "  생성 파라미터 · 생각 {thinking} · {settings}"
  own_piece: "  자기 조각 {name}: {text}"
  persona: "  페르소나 {persona}"
  persona_file: "파일 그대로"
  persona_set: "설정의 글 {count}자"
  system: "  보낼 시스템 프롬프트 {count}자 · sha256 {hash}"
  session: "  방 {room} · 세대 {generation}{reset} · 시스템 프롬프트가 바뀐 때 {at}"
  session_reset: " · 다음 턴에 초기화"

# What `bmo companion` says beside the settings (docs/companions.md, 「Checking a companion by hand」).
shell:
  # Who a change made from a shell is kept under: the account's {user}.
  by: "{user} (명령)"
  # A flag the verb does not read, with the usage after it.
  unknown_flag: "companion: {flag}는 이 명령이 읽는 옵션이 아니에요."
  # Where a list of rooms is empty.
  none: "없음"

# The owner's words said into a room made for companions: the usage, the refusals, and the lines of where
# they went — the {room} by title or number, their {text}, each companion by its {label} and {agent} name, a
# {chat} number, a sent line's {text} and a failed run's {detail}.
say:
  usage: "usage: bmo companion say <방 번호 | 방 이름> '<말>' [--db <아카이브>]"
  empty: "할 말이 비어 있어요."
  not_a_room: "'{room}'은(는) 대화 상대가 답하는 방이 아니에요. 있는 방: {rooms}."
  no_token: "이 프로세스에 BMO_CONTROL_TOKEN이 없어 실행 중인 봇에 말을 넘기지 못했어요."
  unanswered: "봇이 제어 포트 {port}에서 답하지 않아요. 실행 중인 봇이 없으면 이 방에 말을 넘길 수 없어요."
  answered: "봇이 {status}로 답했어요."
  head: "{room} · {owner}: {text}"
  handed: "  → 실행 중인 봇에 넘겼어요. 깨운 대화 상대의 답은 봇의 턴에서 나와요."
  follow_hint: "  {label}의 답 보기: bmo companion follow {chat} --agent {agent}"
  not_called: "  {label}: 부르지 않아 답하지 않았어요."
  answering: "  {label}:"
  sent: "  → {text}"
  failed: "  ✗ {detail}"
  unanswered_turn: "답을 보내지 않았어요."
  bmo_elsewhere: "  {chat_agent}의 답은 실행 중인 봇에서만 나와요."

# An agent's session in a room as its standing pane prints it: an {agent} not in the table, a {room} the
# agent by its {label} holds no session in among its {rooms}, a turn's head by {who} at {at} — the room
# itself named `room` — and a generation's head, with when the newest opened.
follow:
  usage: "usage: bmo companion follow <방 번호 | 방 이름> --agent <에이전트> [--db <아카이브>]"
  unknown_agent: "'{agent}'은(는) 에이전트 표에 없는 이름이에요."
  no_session: "{label}에게는 '{room}' 방의 세션이 없어요. 있는 방: {rooms}."
  turn: "── {who} · {at}"
  room: "방"
  generation: "══ 세대 {generation}"
  generation_opened: "══ 세대 {generation} · {at} 열림"

# A companion started afresh as bmo-server's route answers it: the {label} and {agent}, a preview or the
# reset itself, the {ranges} asked, the {rooms} of each kind, the {count} of rows, files, writer runs and
# copies with each one's {table}, {rows}, {path} or {names}, the brain's commit {state}, a copy's {why} and
# what was left.
reset:
  usage: "usage: bmo companion reset <에이전트> [--conversation] [--person] [--dry-run]"
  conversation: "대화 기록"
  person: "인물 기록"
  head: "{label} ({agent}) {mode}: {ranges}"
  preview: "초기화 미리보기 (아무것도 바꾸지 않음)"
  run: "초기화"
  alone: "  혼자 답하는 방(기록 전체): {rooms}"
  shared: "  함께 답하는 방(제 행만): {rooms}"
  rows: "  행 {count}개"
  row: "    {table}: {rows}"
  files: "  파일 {count}개"
  file: "    {path}"
  writers: "  멈출 인물북 작성 {count}개{names}"
  brain: "  brain 커밋: {state}"
  copies: "  행을 지우는 아카이브 사본 {count}개"
  copy: "    {path}: 행 {rows}개"
  copy_failed: "    {path}: 실패 ({why})"
  left: "  남은 것: {failure}"

# Why a companion was not added on the console or not removed there (docs/companions.md, 「Where a
# companion and its rooms come from」), as the owner is told it under the field: a name that may not be
# used or that an agent already holds as {name}, an empty label, a {provider} that cannot carry a
# companion, a model with no address, a {worker} that is no worker, an empty room title, and a
# companion the deployment seeds, by its {label}; and, for an add that took back the console room standing
# under its name, the added companion's {label} and the room's {title}.
added:
  name: "이름은 영문 소문자로 시작하는 소문자·숫자·하이픈 40자 이내로 입력해 주세요."
  name_taken: "이름 {name}은(는) 이미 다른 에이전트가 쓰고 있습니다."
  label: "표시 이름을 입력해 주세요."
  provider: "{provider} 공급자는 대화 상대를 맡을 수 없습니다."
  model: "모델은 주소가 있는 등록 모델 가운데에서 선택해 주세요."
  worker: "작업 워커는 워커 가운데에서 선택해 주세요: {worker}"
  room: "방 제목을 입력해 주세요."
  seeded: "{label}은(는) 기본으로 들어 있는 대화 상대라 삭제할 수 없습니다."
  taken_back: "{label}이(가) 같은 이름의 방을 다시 맡았습니다. 방 제목은 {title}(으)로 바꾸었고, 메시지와 문서는 그대로 남아 있습니다."

# The one line a companion's turn leaves in the room, under the companion's own name, where its engine ended
# the turn with an error (docs/companions.md, 「What a turn shows」), chosen by the error's kind: the engine busy
# or over its limit, the engine refusing the request, the answer longer than the engine allows, and any other
# error. No marks.
engine_error:
  busy: "엔진이 지금 바빠서 이번 말에는 답하지 못했어요. 잠시 뒤에 다시 말해 주세요."
  refused: "엔진이 요청을 받지 않아서 이번 말에는 답하지 못했어요. 엔진 설정을 확인해야 해요."
  too_long: "답이 엔진이 허용하는 길이를 넘어서 이번 말에는 답하지 못했어요. 조금 짧게 다시 물어봐 주세요."
  failed: "엔진에서 오류가 나서 이번 말에는 답하지 못했어요. 잠시 뒤에 다시 말해 주세요."
