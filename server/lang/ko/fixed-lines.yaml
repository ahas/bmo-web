# The fixed lines no other part holds (docs/boundary.md, 「Fixed lines」): lines the receiver posts under a code
# where no agent's session can say them. Each `{name}` is filled in with what it names.

# What a room is told as a usage limit begins, said as the {chat_agent}.
rest_begins: "{chat_agent} 오늘 머리를 너무 많이 썼어... 한도가 풀릴 때까지 잠깐 쉬러 갈게."

# What a room the owner shut is told: the receiver no longer listens to it nor keeps its words.
chat_denied: "이 방 차단됨. 여기 이야기는 이제 듣지도 저장하지도 않을게."

# What a room is told once in a round whose draft turn ran past its bound, the turn still going on, said as the
# chat agent.
still_working: "아직 답을 준비하고 있어요. 조금만 기다려 주세요."

# What a room is told of a supervisor's turn its guard cut short: the supervisor's {name} and the guard's
# {reason}, the next turn opening a new session.
supervisor_cut: "{name}의 이번 턴을 끊었어요. {reason} 다음 말부터는 새 세션에서 답해요."

# What a room is told, once, when its words arrive while the chat agent's session is replaced and its memory
# tidied: the fresh session answers once that is done.
memory_tidying: "기억 정리 중입니다. 완료 시 대답합니다. 잠시만 기다려주세요."

# What a room in the console is told as an account is let in: the {account} let in and who let them in, {by}, each by
# their shown name.
account_let_in: "{by}님이 {account}님을 대화상대로 추가했습니다."

# What a room in the console is told as an account leaves it by itself, the {account} by its shown name.
account_left: "{account}님이 나갔습니다."

# What a room in the console is told as an account is taken out by another: the {account} and who took them out,
# {by}, each by their shown name.
account_taken_out: "{by}님이 {account}님을 내보냈습니다."

# What a room in the console is told as several accounts are let in at once: the first {account} let in by their
# shown name, how many {others} came with them, and who let them in, {by}.
accounts_let_in: "{by}님이 {account}님 외 {others}명을 대화상대로 추가했습니다."

# What a room in the console is told as an organisation's people are let in at once: the organisation by its name
# with the object particle its last sound takes, {unit}, and who let them in, {by}.
unit_let_in: "{by}님이 {unit} 대화상대로 추가했습니다."

# A person a chat service's line names, by the {name} the service shows for them. Every person the lines below name
# stands so, and each such name ends on a closed syllable, so the particle after it is fixed.
person: "{name}님"

# What stands between the people a line names together, each as `person` writes them: every one is named, as the
# console names the people writing in a room.
people_joiner: ", "

# What a room is told as people come into it by themselves, as a chat service tells it: the {people} who came, each
# as `person` writes them and joined by `people_joiner`.
people_joined: "{people}이 들어왔습니다."

# What a room is told as people are brought into it by another, as a chat service tells it or as two accounts are let
# into a room in the console at once: the {people} who came, named as `people_joined` names them, and who brought them
# in, {by}, as `person` writes them.
people_joined_by: "{by}이 {people}을 대화상대로 추가했습니다."

# What a room is told as a person goes out of it by themselves, as a chat service tells it: the {person} as `person`
# writes them.
person_left: "{person}이 나갔습니다."

# What a room is told as a person is taken out of it by another, as a chat service tells it: the {person} and who
# took them out, {by}, each as `person` writes them.
person_taken_out: "{by}이 {person}을 내보냈습니다."
