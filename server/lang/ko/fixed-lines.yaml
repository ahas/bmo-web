# The fixed lines no other part holds (docs/boundary.md, 「Fixed lines」): lines the receiver posts under a code
# where no agent's session can say them. Each `{name}` is filled in with what it names.

# What a room is told as a usage limit begins, said as the {chat_agent}: until the moment the rest is kept to,
# {until}, where the line names one, else that it comes back soon. The moment is told in the owner's time zone
# (the server's `time.zone` setting): `today` where it falls on the day the line is said, else `another_day`, each
# {hour} and {minute} two digits on a 24-hour clock, {day} the day of the month and {month} that month's word in
# `months`, January first.
rest_begins:
  until: "{chat_agent} 오늘 머리를 너무 많이 썼어... {until}까지 잠깐 쉬러 갈게."
  soon: "{chat_agent} 오늘 머리를 너무 많이 썼어... 잠깐 쉬고 곧 돌아올게."
  today: "{hour}:{minute}"
  another_day: "{month} {day}일 {hour}:{minute}"
  months: ["1월", "2월", "3월", "4월", "5월", "6월", "7월", "8월", "9월", "10월", "11월", "12월"]

# What a room the owner shut is told: the receiver no longer listens to it nor keeps its words.
chat_denied: "이 방 차단됨. 여기 이야기는 이제 듣지도 저장하지도 않을게."

# What a room is told once in a round whose draft turn ran past its bound, the turn still going on, said as the
# chat agent.
still_working: "아직 답을 준비하고 있어요. 조금만 기다려 주세요."

# What a room is told of a supervisor's turn its guard cut short: the supervisor's {name} and the guard's
# {reason}, the next turn opening a new session.
supervisor_cut: "{name}의 이번 턴을 끊었어요. {reason} 다음 말부터는 새 세션에서 답해요."

# What a room is told, once, when its words arrive while the chat agent's session is replaced and its memory
# tidied: the fresh session answers once that is done.
memory_tidying: "기억 정리 중입니다. 완료 시 대답합니다. 잠시만 기다려주세요."

# What a room in the console is told as an account is let in: the {account} let in and who let them in, {by}, each by
# their shown name.
account_let_in: "{by}님이 {account}님을 대화상대로 추가했습니다."

# What a room in the console is told as an account leaves it by itself, the {account} by its shown name.
account_left: "{account}님이 나갔습니다."

# What a room in the console is told as an account is taken out by another: the {account} and who took them out,
# {by}, each by their shown name.
account_taken_out: "{by}님이 {account}님을 내보냈습니다."

# What a room in the console is told as several accounts are let in at once: the first {account} let in by their
# shown name, how many {others} came with them, and who let them in, {by}.
accounts_let_in: "{by}님이 {account}님 외 {others}명을 대화상대로 추가했습니다."

# What a room in the console is told as an organisation's people are let in at once: the organisation by its name
# with the object particle its last sound takes, {unit}, and who let them in, {by}.
unit_let_in: "{by}님이 {unit} 대화상대로 추가했습니다."

# A person a chat service's line names, by the {name} the service shows for them. Every person the lines below name
# stands so, and each such name ends on a closed syllable, so the particle after it is fixed.
person: "{name}님"

# What stands between the people a line names together, each as `person` writes them: every one is named, as the
# console names the people writing in a room.
people_joiner: ", "

# What a room is told as people come into it by themselves, as a chat service tells it: the {people} who came, each
# as `person` writes them and joined by `people_joiner`.
people_joined: "{people}이 들어왔습니다."

# What a room is told as people are brought into it by another, as a chat service tells it or as two accounts are let
# into a room in the console at once: the {people} who came, named as `people_joined` names them, and who brought them
# in, {by}, as `person` writes them.
people_joined_by: "{by}이 {people}을 대화상대로 추가했습니다."

# What a room is told as a person goes out of it by themselves, as a chat service tells it: the {person} as `person`
# writes them.
person_left: "{person}이 나갔습니다."

# What a room is told as a person is taken out of it by another, as a chat service tells it: the {person} and who
# took them out, {by}, each as `person` writes them.
person_taken_out: "{by}이 {person}을 내보냈습니다."

# What a room is told, once while it stays so, as a run of a person's agent there finds no supply source left, said
# straight to the room as the service's own line (the agency's docs/supply.md, 「The facts told」): one sentence for
# each reason the agency names, each saying what the person can do. The moment a source reopens is carried and not
# read.
supply_closed:
  # The supply order named no source for the run.
  no_order: "이 대화방의 에이전트가 쓸 공급원이 정해져 있지 않아 지금은 답할 수 없어요. 설정의 공급에서 공급 로그인이나 공급 키를 추가해 주세요."
  # The person's organisations close every source to them.
  withheld: "조직 설정에서 에이전트 공급원이 모두 꺼져 있어 지금은 답할 수 없어요. 조직 관리자에게 공급원을 켜 달라고 요청해 주세요."
  # The person holds no sign-in or key of their own for the agent's provider.
  no_personal: "이 에이전트가 쓸 내 공급 로그인이나 공급 키가 없어 지금은 답할 수 없어요. 설정의 공급에서 추가해 주세요."
  # The person's own key was refused by its provider.
  own_refused: "내 공급 키가 공급자에게 거부되어 지금은 답할 수 없어요. 설정의 공급에서 키를 새로 등록해 주세요."
  # The person's organisations hold no open key or sign-in for the agent's provider.
  no_organisation: "조직 공급에 지금 쓸 수 있는 공급 키나 공급 로그인이 없어 답할 수 없어요. 조직 관리자에게 문의해 주세요."
  # The organisation's credits refused the run.
  organisation_refused: "조직 크레딧이 남아 있지 않아 지금은 답할 수 없어요. 조직 관리자에게 크레딧 부여를 요청해 주세요."
  # No Claude account is marked lendable for other people's runs now.
  no_lendable: "지금은 다른 사람의 에이전트에 빌려줄 Claude 계정이 없어 답할 수 없어요. 설정의 공급에서 내 Claude 공급 로그인을 추가하거나 플랫폼 관리자에게 문의해 주세요."
  # The person's node is shared with other accounts, where no Claude login is lent.
  shared_node: "지금 쓰는 PC를 다른 사람들과 함께 쓰고 있어서 빌린 Claude 계정으로는 답할 수 없어요. 설정의 공급에서 내 Claude 공급 로그인을 추가하거나 플랫폼 관리자에게 내 PC를 요청해 주세요."
  # The agent's model is another person's own, which no platform supply carries.
  owned: "이 에이전트의 모델은 다른 사람의 모델이라 플랫폼 공급으로 쓸 수 없어요. 에이전트의 모델을 바꿔 주세요."
  # The platform's supply refused the run: the person's credits are spent.
  refused: "크레딧이 남아 있지 않아 지금은 답할 수 없어요. 설정의 공급에서 크레딧을 확인하거나 공급 순서를 바꿔 주세요."
  # The source ran out while the run went on.
  ran_out: "답하는 도중에 크레딧이 떨어져 멈췄어요. 설정의 공급에서 크레딧을 확인하거나 공급 순서를 바꿔 주세요."
  # A reason this pack holds no sentence for.
  other: "이 에이전트가 쓸 공급원이 남아 있지 않아 지금은 답할 수 없어요. 설정의 공급에서 확인해 주세요."

# What a room is told as an agent's session is handed over or reset (the receiver's docs/unified-bmo.md,
# 「Replacing the session」): the line, by the {agent}'s name with its subject particle, {subject}, then why and who
# asked where the line names them. Nothing of the room's record goes with it.
session_handed_over:
  # The session wrote its handoff note, and the next turn opens a fresh session reading it.
  handed_over: "{subject} 잠들어 기억을 정리하고 새 세션으로 깨어납니다"
  # The session was reset, and the next turn opens a new one.
  reset: "{agent}의 세션이 잠들어 기억을 정리하고 새로 시작했습니다. 대화 기록은 그대로 남습니다"
  # Why, after the line: the asker's words, or the words of its cause.
  why: " · {why}"
  # Who asked, after the line and its why, by their shown name.
  by: " · {by}님 요청"
  # Why, where no asker gave words.
  causes:
    full: "대화 맥락이 가득 참"
    road: "공급자 · 모델이 바뀜"
    documents: "지침이 바뀜"

# What the owner's private room keeps, in its record alone, as an agent slept the night through (the agency's
# docs/sleep.md): the {agent}'s name with its subject particle, {subject}, the {date} it slept for, and how many
# memories it {learned}, {merged} and {closed}.
slept: "{subject} {date} 밤에 잠들어 기억을 정리했어요 · 새로 익힘 {learned} · 합침 {merged} · 끝냄 {closed}"
