# What the chat agent tells the owner of a question a job put to them (docs/jobs.md, 「A job's question to the
# owner」), and what a confirmation a job's pane stopped at is asked as, said alike by the bun bot and `bmo-server` where each carries the asking.
# Each `{name}` is filled in with what it names: {owner} the deployment's name for the owner, {item} the
# job's TODO item, {wait} the wait as `minutes` or `seconds` say it, {number} an option's number counted
# from one, {named} the option settled on with its number, {why} the line of why it is asked, {room} the
# number of a room whose registration is gone.

# A wait as the room is told it: a minute or more in {count} minutes, less in {count} seconds.
wait:
  minutes: "{count}분"
  seconds: "{count}초"

# The question put, talked over, and settled.
asked:
  lead: "{owner}, 항목 #{item} 하다가 나 혼자 정하면 안 될 것 같은 게 있어서 물어봐."
  removed_room: "등록이 삭제된 방 {room}에서 온 일이라 그 방 대신 여기서 물어볼게."
  option: "{number}. {recommended}{option}"
  recommended: "(추천) "
  why: "왜 묻냐면: {why}"
  answer: "번호로 답해줘. {wait} 안에 답 없으면 추천대로 {number}번으로 갈게."
  answer_talk: "번호로 답해줘. 선택지가 무슨 뜻인지 묻거나 다른 의견을 말하면 이 일을 하는 Job이 직접 답하고, 얘기하는 동안은 시계를 멈춰 둘게. {wait} 안에 아무 말 없으면 추천대로 {number}번으로 갈게."
  talk_held: "시계 멈췄어. 항목 #{item} Job이 읽고 답할 거야. 정해지면 번호로 답해줘."
  job_says: "항목 #{item} Job:"
  revised: "선택지를 이렇게 바꿨어."
  answer_more: "번호로 답해줘. 더 얘기해도 되고, {wait} 동안 아무 말 없으면 추천대로 {number}번으로 갈게."
  chosen: "항목 #{item}, 골라준 대로 갈게. {named}"
  typed: "항목 #{item}, 말해준 대로 갈게. {answer}"
  talk_lapsed: "{owner}, 항목 #{item}에서 물어본 거 얘기하다가 {wait} 동안 아무 말 없어서 추천대로 정했어. {named}"
  stop_lapsed: "{owner}, 항목 #{item}에서 물어본 거 멈춰 둔 채 {wait} 동안 답이 없어서 추천대로 정했어. {named}"
  lapsed: "{owner}, 항목 #{item}에서 물어본 거 {wait} 동안 답이 없어서 추천대로 정했어. {named}"

# A confirmation a job's pane stopped at, put to the owner as a question: its options for a command to
# allow or refuse and for a window the reading does not know, the question by its {mark}, why the runner
# does not answer it alone, and the lines of a question withdrawn or a command the runner allowed itself.
# `answered_in_pane` is also what such a question is settled with, read back to tell it apart.
pane:
  allow: "허가: 화면의 명령을 그대로 실행한다"
  refuse: "거절: 실행하지 않고 Job에게 안전하게 다시 하라고 알린다"
  close: "닫는다: 창을 닫고 Job에게 알린다"
  leave: "그대로 둔다: Herdr에서 직접 답한다"
  permission: "{mark} Job이 이 명령을 실행해도 되는지 묻는 확인 창에서 멈췄어."
  unknown: "{mark} Job의 팬이 사람의 답을 기다리는 창에서 멈췄어."
  unknown_text: "무슨 창인지는 이 읽기가 몰라. 그때 화면은 실행 로그에 남겨 뒀어."
  why: "Job 자기 작업 공간 밖을 건드리거나 러너가 판단하지 못한 명령이라, 러너가 혼자 답하지 않아"
  lead: "{owner}, 항목 #{item} Job이 팬의 확인 창에서 멈췄어."
  withdrawn: "항목 #{item}의 확인 창이 답하기 전에 닫혀서(Herdr에서 직접 답했거나 실행이 끝남) 물어본 건 거둘게."
  own_work: "Job 자기 작업 공간 안에서만 움직이는 명령이라 러너가 묻지 않고 허가합니다"
  answered_in_pane: "답하기 전에 확인 창이 닫힘"
