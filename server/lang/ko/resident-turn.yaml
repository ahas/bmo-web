# What a turn put into a standing program writes as it goes (docs/agent-control.md, 「The order for
# putting in one turn and waiting for it to end」), said alike by the bun bot and bmo-server.

# What a turn put into a standing program writes into its run's log as it goes, read by a person on the
# console and by whoever follows the run up. Each `{name}` is filled in with what it names: the {config}
# and the {cwd} whose trust was written, {why} the trouble, the run's {title}, {model} and {attempt}, the
# {seconds} herdr or the record stood silent and the {state} the pane came back in, and what the record
# counted at a quiet end: {queued} words waiting, {owed} turns owed and {ended} turns ended.
notes:
  title: "{title} · {model} · {attempt}회차"
  trust_written: "Claude Code 설정 {config}에 이 폴더({cwd})를 믿는다고 적었습니다"
  trust_unwritten: "Claude Code 설정 {config}에 이 폴더({cwd})의 신뢰를 적지 못했습니다: {why}"
  trusted_folder: "처음 뜬 폴더라 믿느냐는 확인에 믿는다고 답했습니다"
  person_turn: "사람이 Herdr 에서 넣은 턴이 끝나기를 기다립니다"
  stand_again: "{why} 프로그램을 다시 세우고 이 턴을 한 번 더 넣습니다"
  untrusted: "폴더 신뢰 확인창에서 넘어가지 않아"
  not_ready: "프로그램이 입력 대기 상태가 되지 않아"
  not_taken: "프로그램이 넣는 말을 받지 않아"
  herdr_silent_ready: "준비 시간이 다 가도록 Herdr가 팬을 묻는 말에 답하지 않아 턴을 Herdr 무응답으로 끝냅니다"
  enter_pressed: "넣은 말이 입력줄에 남아 제출되지 않아 엔터를 한 번 눌렀습니다"
  unsubmitted: "넣은 말이 엔터를 눌러도 제출되지 않아 이 턴을 끝냅니다"
  overrun_unasked: "시간 제한을 넘긴 턴을 물을 곳이 답하지 못해 제한대로 끊습니다: {why}"
  herdr_silent: "Herdr가 팬을 묻는 말에 답하지 않아 기록을 읽으며 기다립니다 ({cause})"
  herdr_gave_up: "Herdr가 {seconds}초 동안 팬을 묻는 말에 답하지 않아 턴을 Herdr 무응답으로 끝냅니다"
  herdr_back: "Herdr가 {seconds}초 만에 다시 답했습니다. 팬은 {state} 상태입니다"
  quiet: "프로그램이 쉬고 기록이 {seconds}초 동안 자라지 않아 라운드를 끝난 것으로 읽습니다. 기록으로 센 것: 대기 {queued}건, 갚을 턴 {owed}개, 끝난 턴 {ended}개"
  error_menu: "턴이 프로그램의 오류로 끝난 뒤 다음에 할 일을 고르는 선택창이 떠 있어 Esc로 닫았습니다"

# The heading a kept screen is filed under as a turn ends without its answer: the pane gone, the program
# never ready or not taking the words ({code}, {message}), the words never submitted, the turn stopped,
# overrun or silent, or a window the reading does not know with its {screen}.
screens:
  vanished: "팬이 준비되기 전에 사라졌습니다. 그때 화면은 이렇습니다"
  not_ready: "준비 시간이 다 가도록 프로그램이 입력 대기 상태가 되지 않았습니다. 그때 화면은 이렇습니다"
  not_taken: "프로그램이 넣는 말을 받지 않았습니다 ({code}: {message}). 그때 화면은 이렇습니다"
  unsubmitted: "넣은 말이 제출되지 않은 채 팬이 서 있던 화면입니다"
  stopped: "턴이 밖에서 중지되었습니다. 그때 화면은 이렇습니다"
  overran: "턴이 주어진 시간 안에 끝나지 않았습니다. 그때 화면은 이렇습니다"
  silent: "턴이 아무 답도 기록에 쓰지 않았습니다. 그때 화면은 이렇습니다"
  unknown_window: "이 읽기가 모르는 창에서 멈췄습니다. 그때 화면은 이렇습니다\n\n{screen}"

# A confirmation the program puts up in the middle of a turn: the mark the job question asking it
# carries, and what the run writes down of how it was answered — after {tries} tries, stopped at its
# {question}, or left to a person for {why}.
confirm:
  mark: "[확인 창]"
  left_to_person: "확인 창을 사람이 답하도록 그대로 둡니다"
  no_allow: "허가할 위치를 화면에서 찾지 못해 확인 창을 사람에게 남겨 둡니다"
  allowed: "확인 창에 허가로 답했습니다"
  refused_with_reason: "확인 창에 거절로 답하고 이유를 함께 보냈습니다"
  refused: "확인 창에 거절로 답했습니다"
  closed: "확인 창을 닫았습니다"
  tries: "확인 창에 {tries}번 답해도 창이 그대로라 사람에게 남겨 둡니다"
  again: "답을 넣은 뒤에도 확인 창이 그대로라, 같은 답을 다시 넣습니다"
  answered: "확인 창이 답을 받고 닫혔습니다"
  changed: "답이 왔을 때 창의 질문이 달라져 있어 그 답을 넣지 않았습니다"
  repeated: "이 턴에 이미 답한 확인 창이 다시 떠서, 그때 받은 답으로 답합니다"
  closed_early: "확인 창이 답을 받기 전에 닫혔습니다"
  stopped_at: "확인 창에서 멈췄습니다: {question}"
  unasked: "확인 창을 물어보지 못해 사람에게 남겨 둡니다: {why}"
