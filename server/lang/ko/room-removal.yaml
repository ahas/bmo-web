# What the removal of a room's registration says of the room before anything is taken (docs/chat-providers.md,
# 「Removing a room's registration」): each sentence is said by the declaration of the code that depends on
# what it names, and the confirmation shows them together.
# Each `{name}` is filled in with what it names: {names} the labels of the supervisors the room names, {count} a number of rows,
# {user} a user's name, {road} the label of a platform's road.

# Why a room is not removed, nothing written.
refused:
  seeded: "감독관 시드에 선언된 방이라 다음 시작 때 다시 만들어지므로 삭제할 수 없습니다."
  infra: "설정에 지정된 인프라 방이라 삭제할 수 없습니다."
  owner: "플랫폼 관리자의 개인 대화방이라 삭제할 수 없습니다. 보고와 질문이 이 방으로 전달됩니다."
  # Asked by anyone but the administrator, on either route.
  administrator: "방 등록은 플랫폼 관리자만 삭제할 수 있습니다."
  # A room number that is not a whole number.
  chat: "삭제할 방 번호가 올바르지 않습니다."

# What the confirmation warns of.
warned:
  answerers: "이 방에 답하는 감독관이 있습니다: {names}. 감독관은 남지만 이 방에서는 더 이상 답하지 않습니다."
  items: "이 방에서 만든 열린 항목이 {count}건 있습니다. 항목은 남고, 소식은 플랫폼 관리자의 개인 대화방으로 전달됩니다."
  questions: "이 방에서 나온 Job의 질문 중 답을 기다리는 질문이 {count}건 있습니다."
  private: "{user} 사용자의 개인 대화방입니다."
  road: "{road} 경로로 아직 이 방에 연결할 수 있습니다. 이후 메시지가 오면 새 방으로 다시 등록됩니다."
