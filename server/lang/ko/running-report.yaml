# The words of the report of what is running on this machine and what is waiting (docs/agent-control.md,
# 「Reading everything running at once」), written by `bmo run list`, by the bun bot's running report while it
# stands, and by the stop verb's own listing. Each `{name}` is filled in with what it names.

# Each section's heading, in the order the report writes them.
sections:
  deployment: "[배포]"
  machine: "[기계]"
  testbed: "[테스트베드]"
  nodes: "[노드 배정]"
  switches: "[스위치]"
  runs: "[실행]"
  unheld_watches: "[러너 없는 워치]"
  rooms: "[방]"
  workers: "[워커]"
  pending: "[올라갈 커밋]"
  orders: "[작업 지시서]"
  questions: "[답을 기다리는 질문]"

# A length of time the way a person reads one at a glance: under a minute in {seconds}, under an hour in
# {minutes}, and beyond that in {hours} and the {minutes} past them.
span:
  seconds: "{seconds}초"
  minutes: "{minutes}분"
  hours: "{hours}시간 {minutes}분"
  ago: "{span} 전"
  after: "{span} 뒤"
  elapsed: "{span}째"

# What each kind of run is called, in the report and in the stop verb's listing alike.
kinds:
  gate: "게이트"
  runner: "러너"
  editor: "에디터"
  worker: "Job"

# An execution the archive holds open: its {id}, {provider}, {model}, {attempt}, {state}, {shared}, {parent}
# and the {root} it started from.
execution:
  line: "실행 {id}: {provider} · {model} · {attempt}회차 · {state}{shared} · 부모 {parent} · 시작 작업 {root}"
  no_model: "모델 기록 없음"
  requested: "요청 기록"
  unknown: "현재 상태 확인 필요"
  shared_pane: " · 부모 팬 공유"
  no_parent: "없음"

# A place that could not be asked, with the {error} it gave; the bot cannot be asked without its token.
unreachable:
  no_token: "control API 토큰(BMO_CONTROL_TOKEN)이 없습니다"
  bot: "봇이 답하지 않습니다 ({error}). 게이트·맥락 접기·답하는 방은 봇의 기억에만 있어 알 수 없고, 아래 실행은 기록과 systemd·Herdr로 확인한 것입니다."
  herdr: "Herdr에 묻지 못했습니다 ({error}). 팬의 에이전트 상태는 비어 있습니다."

# 「[노드 배정]」: each machine by its {label} with the {jobs} and heavy {runs} it was given and its {room},
# and where the {next} heavy run goes.
nodes:
  machine: "{label}: Job {jobs}회 · 무거운 실행 {runs}회 · {room}"
  free: "여유 있음"
  held: "보류: {held}"
  next: "다음 무거운 실행: {next}"
  next_here: "이 기기 (노드에 보내는 곳 없음)"

# 「[테스트베드]」: who holds a lane's turn, or that nobody does, and who waits behind it at each place {at},
# each {entry} by its {place} with its {job} and {todo} where it is a job's, its checkout and its command
# joined, then the {minutes} it has stood and its marks; and the narrow lane's own line with its {width}.
testbed:
  nobody: "쥔 쪽 없음"
  holder: "쥔 쪽: {entry}"
  waiting: "대기 {at}: {entry}"
  job: "{place} Job #{job}"
  todo: " (#{todo})"
  joiner: " · "
  minutes: " · {minutes}분째"
  front: " · 배포 우선"
  kept: " · 돌아올 Job의 순서 보존"
  narrow: "좁은 줄 ({width}스레드):"

# 「[기계]」: the machine read in one line, its parts joined — the {load} over its {threads}, the memory pressure
# {full} or that it could not be read, the {available} memory of its {total}, the {free} swap of its {total},
# the disk's {free} room, the {jobs} open with the {browsers} among them that hold a browser — then the verdict:
# room to spare, or a launch held for its {reasons} joined; and a machine that could not be read at all, with
# its {jobs} and {verdict}. A machine with no name of its own on the rotation is called `here`.
machine:
  joiner: " · "
  load: "부하 {load} ({threads}스레드)"
  pressure: "메모리 압박 {full}"
  pressure_unread: "확인 불가"
  available: "사용 가능 메모리 {available}/{total}GB"
  swap: "남은 스왑 {free}/{total}GB"
  disk: "디스크 여유 {free}GB"
  jobs: "Job {jobs}개 (브라우저 {browsers}개)"
  free: "여유 있음"
  held: "띄우기 보류: {reasons}"
  reasons_joiner: ", "
  unread: "기계를 읽지 못함 · {jobs} · {verdict}"
  here: "이 기기"
  # Why a launch is held: each reading against its {limit} — the memory pressure {full}, the {available}
  # memory, the {load} over the {threads}, the disk's {free} room, the {jobs} open and those holding a browser
  # — and a work node whose link is down, by its {label}.
  holds:
    pressure: "메모리 압박 {full}% ≥ {limit}%"
    available: "사용 가능 메모리 {available}GB < {limit}GB"
    load: "부하 {load} ≥ {threads}스레드 × {limit}"
    disk: "디스크 여유 {free}GB < {limit}GB"
    jobs: "실행 중 Job {jobs}개 ≥ {limit}개"
    browser_jobs: "브라우저를 띄운 Job {jobs}개 ≥ {limit}개"
    node_down: "노드 {label} 연결 끊김"
  # What the machine watch tells the owner's session, each closed by the {machine} line above and, where the
  # memory is at stake, the {holders} below: the memory pressure {full} that stood {minutes} over the alert line
  # {alert}; the disk's {free} room under the launch {limit}; and the herdr calls, {count} of them, left
  # unanswered, with their {methods} each by its {method} and {count} and joined.
  alerts:
    pressure: "이 기계의 메모리 압박(full)이 {minutes}분째 {full}%로 알림 기준 {alert}%를 넘었다. {machine}.{holders}"
    disk: "데이터 루트가 있는 디스크의 여유가 {free}GB로 Job 띄우기 기준 {limit}GB 아래다. 여유가 돌아올 때까지 새 Job은 띄우지 않고 기다린다. {machine}."
    herdr: "Herdr가 호출 {count}건({methods})에 제시간 안에 답하지 않았다. {machine}.{holders}"
    herdr_method: "{method} {count}건"
    methods_joiner: ", "
  # Who holds the most of the memory, carried with its own lead space as an alert's {holders}: the {holders}
  # joined, each the {who} with its {size} and its {browsers} where it holds any; a job's {who} is the {job}
  # with its {todo} where it has one, and its {place}.
  holders:
    line: " 메모리를 가장 많이 쥔 쪽: {holders}."
    joiner: "; "
    holder: "{who} {size}{browsers}"
    job: "Job #{job}{todo} {place}"
    todo: "(항목 #{todo})"
    browsers: ", 브라우저 {browsers}개"

# 「[배포]」: a deployment's {unit} at work and each of its {step}s, what it waited and ran in {waited} and
# {ran} seconds and the {code} it ended on; or one cut off in the middle and how to finish it from the
# deploy {tree}.
deployment:
  unread: "systemd에 묻지 못해 실행 중인 배포와 도중에 끊긴 배포를 읽지 못했습니다."
  unit: "- 배포 중: {unit} · journalctl --user -u {unit} --no-pager"
  step: "  - {step}: 대기 {waited}초 · 실행 {ran}초{code}"
  step_code: " · 종료 코드 {code}"
  cut: "배포가 도중에 끊겼습니다. 배포 트리는 {commit} 「{subject}」에 {ago} 깔렸는데, 봇은 그 뒤로 시작되지 않아 {bot}."
  bot_old: "그 전 코드로 실행 중입니다"
  bot_down: "멈춰 있습니다"
  cut_ahead: "배포가 도중에 끊겼습니다. 배포 트리의 코드가 아카이브보다 앞서 있습니다."
  schema: "아카이브 스키마 버전 {stored} · 배포 트리의 코드가 요구하는 버전 {needs}. 배포 트리의 스크립트가 아카이브를 열지 못합니다."
  redeploy: "끝내려면: {tree}/bin/bmo deploy commit --commit {commit} --then '<왜>' (같은 커밋을 다시 깔고 봇을 그 위에서 시작합니다)"
  backlog: "끝내려면: {tree}/bin/bmo deploy backlog ({pending} 지우지 않은 채 기다리고 있어, 다시 실행하면 끝까지 올라갑니다)."
  backlog_unread: "밀린 커밋이"
  backlog_count: "밀린 커밋 {count}개가"

# The deployment's hold in one line: its {commits}, what it {takes} away, whom it is {waiting} on and whom it
# lets go {passing} through the restart, how long it has stood ({since}) and how long it may stand yet
# ({left}).
hold:
  line: "{commits} · {takes}{waiting}{passing} · {since}째, 길어야 {left} 더 (새 Job을 띄우지 않는다. 배포 실행이 도중에 죽었으면 bmo deploy backlog를 다시 실행할 때 풀린다)"
  commits_unread: "커밋을 읽지 못함"
  takes_unread: "옛 코드가 읽는 것을 걷는지 읽지 못함"
  takes: "걷는 것: {breaks}"
  waiting_unread: "실행 중인 Job을 읽지 못함"
  waiting_none: "기다리는 Job 없음, 곧 재시작"
  waiting: "기다리는 Job {count}개: {jobs}"
  passing: " · 기다리지 않는 Job {count}개: {jobs}"

# 「[스위치]」: the four switches, each by its label and its state.
switches:
  queue: "자동 진행: {state}"
  # The queue paused by the {owner}, named.
  queue_paused: "일시정지 ({owner})"
  queue_on: "켜짐"
  hold: "배포 대기: {state}"
  hold_none: "없음"
  rest: "휴식 상태: {state}"
  rest_none: "아님"
  rest_on: "{kind}, {until}까지"
  rest_limit: "사용량 한도"
  rest_outage: "API 장애"
  keepalive: "킵얼라이브: {state}"
  keepalive_stopped: "멈춤"
  keepalive_on: "켜짐"

# Beside the road a job or a task went out on: the mark of a road the provider order fell to, and the mark of a
# step whose runs went out on more than one (docs/work-orders.md 「The model a step ran on」).
model:
  fallback: "(폴백)"
  changed: "(모델 바뀜)"

# 「[실행]」: what is said of a run beside its kind, agent, item, room, model and unit.
runs:
  none: "실행 중인 것이 없습니다."
  cap: " / 상한 {cap}"
  stop: "중지 {target}"
  activity: "마지막 활동 {ago}"
  wait: "기다림: {wait}"
  # A job's own mark on a long wait: {what} it waits on, its {target} and the {clock} it waits until or is past.
  wait_until: "{what} · {target} · {clock}까지"
  wait_overdue: "{what} · {target} · {clock} 넘김"
  # The thing a wait mark names as its {target}: a unit by its {name}, or a process by its {pid}.
  wait_unit: "유닛 {name}"
  wait_pid: "pid {pid}"
  deploy_waits: "배포가 이 Job을 기다림"
  pane: "팬 {agent} {status}"
  pane_agent_unknown: "에이전트 미확인"
  pane_status_unknown: "상태 미확인"
  pane_blocked: "blocked · 확인 창 대기"

# A research run past its grace whose unit is gone, closed as died and told to the chat agent: the {agent}, the {run}
# row, the {search} it carried where it carried one, how many {minutes} it stood and its {unit}.
died:
  research: "{agent} 러너 run #{run}{search}가 끝을 적지 못하고 죽었다. {minutes}분 서 있었고 유닛은 {unit}. 행은 died로 닫았다."
  search: "(조사 #{search})"

# A standing watch under the run that holds it or under its own section: its {id}, {room}, {name} and the
# {memory} it serves, its note, its moment or its check, and how its checks have gone.
watch:
  timer: "타이머"
  between_runs: "다음 확인 러너 대기"
  head: "워치 #{id} · {room} · {name} · {memory}"
  no_memory: "메모리 없음"
  memory: "메모리 #{id}"
  note_whole: "  내용:"
  note: "  내용 {note}"
  moment: "  시각 {clock}{left}"
  condition: "  조건 {condition}"
  interval: "  {interval}초마다 · {deadline}까지 · {last}"
  unchecked: "아직 확인 안 함"
  checked: "마지막 확인 {ago} · {outcome}"
  timed_out: "시간 초과"
  met: "충족"
  unmet: "미충족 (종료 {code})"

# 「[방]」: a {room} folding its context or answering a round, with its {messages}, {instructions} and how
# long it has been at it ({elapsed}).
rooms:
  none: "맥락을 접거나 답하는 방이 없습니다."
  folding: "- {room} 맥락 접는 중 · {elapsed}"
  answering: "- {room} {speaker}답하는 중 · 메시지 {messages} · 지시 {instructions} · {elapsed}"
  stop: " · 중지 {target}"
  # A chat named by its {id} alone, where nothing else names it.
  unnamed: "방 {id}"

# 「[워커]」: each checkout and what holds it — a {worker}'s {job} with its {item} and {unit}, a work order
# by its {id}, or the lock with nothing behind it.
workers:
  free: "비어 있음"
  holds: "쥔 것: {holds}"
  order: "작업 지시서 #{id}"
  lock: "Job 잠금 (열린 Job 행 없음)"
  job: "{worker}의 Job {job} ({item}) {unit}"
  item: "항목 #{id}"
  itemless: "항목 없음{purpose}"

# 「[올라갈 커밋]」.
pending:
  none: "배포를 기다리는 커밋이 없습니다."
  # No commit waiting, but main {count} commits past the live one, each named on a line of its own by its
  # short {commit} and {subject}; or main against the live commit not read.
  ahead: "배포를 기다리는 커밋은 없지만 main이 라이브 커밋보다 {count}개 앞서 있습니다. 대기 목록에 오르지 않은 커밋이라 bmo deploy backlog로는 올라가지 않으니 bmo deploy main --then '<왜>'로 올립니다."
  ahead_commit: "- {commit} 「{subject}」"
  ahead_unread: "main이 라이브 커밋보다 앞서 있는지 읽지 못했습니다."
  urgent: "즉시 올려야 할 커밋이 있습니다. 스키마가 배포된 것보다 앞서 있어 체크아웃의 스크립트가 아카이브를 열지 못합니다."

# 「[작업 지시서]」: an order's state, phase and the {stage} of {stages} it stands at with its {title}, why it
# stopped and why it holds its checkout, its place in the queue, and each task's state and round.
orders:
  none: "진행 중이거나 멈춘 작업 지시서가 없습니다."
  closing: "종료 중"
  no_worker: "워커 없음"
  stage: " {stage}/{stages} 단계{title}"
  stage_title: " 「{title}」"
  skipped: " · 건너뜀 {count}"
  error: "  멈춘 이유: {error}"
  holding: "  체크아웃을 쥔 이유: {holding}"
  place: "  큐 순서: {place}"
  attempt: "{attempt}회차"

  status:
    draft: "초안"
    active: "진행 중"
    paused: "멈춤"
    done: "완료"

  phase:
    planning: "설계"
    research: "조사·검증"
    synthesis: "종합"
    implementation: "구현"
    finalization: "마무리"

  task:
    pending: "대기"
    running: "실행 중"
    done: "완료"
    failed: "실패"
    skipped: "건너뜀"

# 「[답을 기다리는 질문]」: each question's deadline, {left} until it or past it.
questions:
  none: "기다리는 질문이 없습니다."
  paused: "카운트다운 멈춤"
  due: "{left} 뒤 마감"
  overdue: "마감 지남"
