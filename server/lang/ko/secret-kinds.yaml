# The default secret kinds the migrations seed once each (docs/accounts.md, 「Secret kinds」): each kind's name and
# description, and each field's label, under the kind's key and the field's key in lower snake case. From then on a
# kind is the owner's to change on the console, and its lines are read no more.
kinds:
  # A key or a token of one service, one masked line.
  api_key:
    name: "API 키"
    description: "서비스 하나의 API 키나 토큰"
    fields:
      # The key or token itself.
      api_key: "API 키"
  # A sign-in to an account, its user name and its password.
  account_login:
    name: "계정 로그인"
    description: "사용자 이름과 비밀번호"
    fields:
      # The name the account signs in as.
      username: "사용자 이름"
      # The account's password.
      password: "비밀번호"
  # An AWS access key, with the region it is used in.
  aws_access_key:
    name: "AWS 액세스 키"
    description: "액세스 키 ID, 비밀 액세스 키, 리전"
    fields:
      # The access key's id.
      aws_access_key_id: "액세스 키 ID"
      # The access key's secret.
      aws_secret_access_key: "비밀 액세스 키"
      # The region the key is used in.
      aws_region: "리전"
  # An OAuth client, its id and its secret.
  oauth_client:
    name: "OAuth 클라이언트"
    description: "클라이언트 ID와 클라이언트 보안 비밀번호"
    fields:
      # The client's id.
      client_id: "클라이언트 ID"
      # The client's secret.
      client_secret: "클라이언트 보안 비밀번호"
  # A connection to a database.
  database:
    name: "데이터베이스 연결"
    description: "호스트, 포트, 사용자, 비밀번호, 데이터베이스"
    fields:
      # The host the database server answers on.
      db_host: "호스트"
      # The port it answers on.
      db_port: "포트"
      # The user it is signed in to as.
      db_user: "사용자"
      # That user's password.
      db_password: "비밀번호"
      # The database's name on the server.
      db_name: "데이터베이스"
  # An SSH private key, pasted as several lines or read from a file.
  ssh_private_key:
    name: "SSH 개인 키"
    description: "여러 줄로 붙여 넣거나 파일에서 불러오는 개인 키"
    fields:
      # The private key itself.
      ssh_private_key: "개인 키"
  # A file kept whole, such as a certificate or a service account's JSON.
  file:
    name: "파일"
    description: "인증서, 서비스 계정 JSON 같은 파일"
    fields:
      # The file itself.
      file: "파일"
  # A payment card, its number and its CVC masked.
  card:
    name: "카드"
    description: "카드 번호, 유효기간, CVC, 소유자 이름"
    fields:
      # The number on the card's face.
      card_number: "카드 번호"
      # The month and year the card is good until.
      card_expiry: "유효기간"
      # The security code on the card's back.
      card_cvc: "CVC"
      # The name the card is issued in.
      card_holder_name: "소유자 이름"
  # Where a parcel is sent: who takes it, how they are reached, and the address.
  delivery_address:
    name: "배송지"
    description: "받는 사람, 전화번호, 우편번호, 주소, 상세 주소"
    fields:
      # The person the parcel is for.
      recipient: "받는 사람"
      # The number the courier calls.
      phone: "전화번호"
      # The postal code.
      postal_code: "우편번호"
      # The street address.
      address: "주소"
      # The building, floor or unit after the street address.
      address_detail: "상세 주소"
