  instruction_size: "작업 지시는 1~30000자로 입력합니다."
  model_tier: "모델 등급은 {tiers} 중 하나입니다."
  coworker_tier: "코워커 등급은 {tiers} 중 하나입니다. {worker_only} 등급은 코워커로 빌리지 않습니다."
