# The work order script's own flags, and a bot it could not reach to stop an item or edit an order: the
# {flag} lacking a value, the {verbs} named together, the {error} the call gave and the {status} the bot
# answered with.
script:
  value: "{flag} 뒤에 값이 필요합니다."
  verbs: "한 번에 동사 하나만 씁니다: {verbs}"
  recover: "--recover 는 <첫 Job>-<끝 Job> 으로 적습니다."
  stop_no_token: "봇의 control API 토큰(BMO_CONTROL_TOKEN)이 없어 중지하지 않았습니다."
  stop_unreachable: "봇이 답하지 않아 중지하지 않았습니다. 봇이 떠 있을 때 다시 부릅니다. ({error})"
  stop_refused: "봇이 중지를 받지 않았습니다 (HTTP {status})."
  edit_no_token: "봇의 control API 토큰(BMO_CONTROL_TOKEN)이 없어 지시서를 고치지 않았습니다."
  edit_unreachable: "봇이 답하지 않아 지시서를 고치지 않았습니다. 봇이 떠 있을 때 다시 부릅니다. ({error})"
  edit_refused: "봇이 요청을 받지 않았습니다 (HTTP {status})."
