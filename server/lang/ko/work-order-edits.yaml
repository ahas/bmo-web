# The control route's verbs on a work order and an item: a stopped order's place in its line, a body
# field by its {name}, runs asked to stop that are still {alive}, a result document already at its {path}.
orders:
  paused: "TODO #{item}의 작업 지시서는 멈춰 있어요. 그 워커 줄에서 차례가 오면 봇이 스스로 재개하고, 지금 재개하려면 bmo work-order --todo {item} --resume 을 씁니다."
  not_text: "{name} 값은 문자열입니다."
  missing: "{name} 값이 필요합니다."
  still_running: "실행 중지를 요청했지만 아직 끝났다고 확인되지 않았습니다: {alive}"
  document_there: "{path}에 결과 문서가 이미 있어 덮지 않습니다."
  reopen_done: "완료된 작업 지시서만 다시 엽니다."
  draft_only: "실행 전 초안만 수정할 수 있습니다."
  order_and_model: "작업 지시서와 모델을 확인하세요."
  approved_only: "승인된 진행 가능 TODO만 실행합니다."
  active: "TODO #{item}: 저장된 단계가 이미 진행 중입니다."
  done: "완료된 작업 지시서는 다시 실행하지 않습니다. 앞 결과를 살려 다시 실행하려면 bmo work-order --todo {item} --reopen 으로 엽니다."
  model: "올바르지 않은 작업 모델입니다."
  chat: "chatId가 올바르지 않습니다."
  not_checkout: "{cwd}는 git 저장소가 아니라 협업을 실행하지 않습니다."
  not_checkout_run: "{cwd}는 git 저장소가 아니라 협업을 실행하지 않습니다. 협업 없이 일반 Job으로 실행해 주세요."
  item_number: "TODO 번호가 올바르지 않습니다."
