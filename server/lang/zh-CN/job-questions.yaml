# Translated from server/lang/ko/job-questions.yaml; its comments say what each value is.
wait:
  minutes: "{count} 分钟"
  seconds: "{count} 秒"
asked:
  lead: "{owner}，处理条目 #{item} 时遇到一件我不该自己拿主意的事，所以来问你。"
  removed_room: "这件事来自已删除登记的房间 {room}，所以改在这里问你。"
  option: "{number}. {recommended}{option}"
  recommended: "（推荐）"
  why: "为什么问：{why}"
  answer: "请回复编号。{wait}内没有回复的话，我就按推荐选 {number}。"
  answer_talk: "请回复编号。如果你问选项是什么意思或提出别的意见，负责这件事的 Job 会直接回答你，聊的期间计时会暂停。{wait}内没有任何回复的话，我就按推荐选 {number}。"
  talk_held: "计时已暂停。条目 #{item} 的 Job 会看完后回答。定下来后请回复编号。"
  job_says: "条目 #{item} 的 Job："
  revised: "选项改成了这样。"
  answer_more: "请回复编号。也可以接着聊；{wait}内没有任何回复的话，我就按推荐选 {number}。"
  chosen: "条目 #{item}，按你选的来。{named}"
  typed: "条目 #{item}，按你说的来。{answer}"
  talk_lapsed: "{owner}，条目 #{item} 的问题聊到一半，{wait}内没有回复，我按推荐定了。{named}"
  stop_lapsed: "{owner}，条目 #{item} 的问题暂停后 {wait}内没有回复，我按推荐定了。{named}"
  lapsed: "{owner}，条目 #{item} 的问题 {wait}内没有回复，我按推荐定了。{named}"
pane:
  allow: "允许：按屏幕上的命令原样执行"
  refuse: "拒绝：不执行，并告诉 Job 安全地重做"
  close: "关闭：关闭窗口并告知 Job"
  leave: "保持不动：在 Herdr 中直接回答"
  permission: "{mark} Job 停在了询问是否可以执行此命令的确认窗口。"
  unknown: "{mark} Job 的窗格停在了等待人工回答的窗口。"
  unknown_text: "这次读取无法判断是什么窗口。当时的画面已留在运行日志中。"
  why: "该命令会触及 Job 自身工作区之外，或运行器无法判断，所以运行器不会自行回答"
  lead: "{owner}，条目 #{item} 的 Job 停在了窗格的确认窗口。"
  withdrawn: "条目 #{item} 的确认窗口在回答前已关闭（已在 Herdr 中直接回答，或运行已结束），所以撤回这个问题。"
  own_work: "该命令只在 Job 自身的工作区内操作，运行器不询问直接允许"
  answered_in_pane: "回答前确认窗口已关闭"
