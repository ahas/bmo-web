# Translated from server/lang/ko/running-report.yaml; its comments say what each value is.
sections:
  deployment: "[部署]"
  machine: "[机器]"
  testbed: "[测试台]"
  nodes: "[节点分配]"
  switches: "[开关]"
  runs: "[运行]"
  unheld_watches: "[无运行器的监视]"
  rooms: "[房间]"
  workers: "[工作器]"
  pending: "[待上线的提交]"
  orders: "[工作指令单]"
  questions: "[等待回答的问题]"
span:
  seconds: "{seconds} 秒"
  minutes: "{minutes} 分钟"
  hours: "{hours} 小时 {minutes} 分钟"
  ago: "{span}前"
  after: "{span}后"
  elapsed: "已 {span}"
kinds:
  gate: "门控"
  runner: "运行器"
  editor: "编辑器"
  worker: "Job"
execution:
