# The work order script's own flags, and a bot it could not reach to stop an item or edit an order: the
# {flag} lacking a value, the {verbs} named together, the {error} the call gave and the {status} the bot
# answered with.
script:
  value: "{flag} 后面需要一个值。"
  verbs: "一次只能使用一个动词：{verbs}"
  recover: "--recover 请写成 <第一个 Job>-<最后一个 Job>。"
  stop_no_token: "缺少机器人的 control API 令牌（BMO_CONTROL_TOKEN），未停止。"
  stop_unreachable: "机器人没有响应，未停止。请在机器人运行时再次调用。（{error}）"
  stop_refused: "机器人未接受停止请求（HTTP {status}）。"
  edit_no_token: "缺少机器人的 control API 令牌（BMO_CONTROL_TOKEN），未修改工作指令单。"
  edit_unreachable: "机器人没有响应，未修改工作指令单。请在机器人运行时再次调用。（{error}）"
  edit_refused: "机器人未接受请求（HTTP {status}）。"
