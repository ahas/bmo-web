# How the testbed tests, checks, builds and deploys this repository, in the testbed's declaration format.

testbed = 0
name = "web"

[test]
# The server's crate, and the client workspace, a project of its own found by its manifest and lockfile, whose
# `check` script is the console's typecheck and its tests, the browser tests among them, one file after another.
# The testbed gathers no test file inside a project, so none is declared for the browser lane (docs/checks.md,
# 「How the suite runs the tests」).
languages = ["cargo", "bun"]
setup = ["cd client && bun install --frozen-lockfile"]

# The server's tests make their own scratch databases on the server, so no template is named.
[test.database]

[runner]
# The console-driven browser files read the address of a console standing on this machine's loopback, so a run
# naming one stays on this machine (docs/checks.md, 「Running the console-driven browser files」).
local_variables = ["BMO_CONSOLE_TEST_URL", "BMO_SKELETON_TEST_URL"]

[check]
# The sweeps that read the tree before anything runs: Korean in the code, the README's folder table, the
# dependencies the manifests name, and the shared versions the manifests and the lock hold to. The ledger is the
# debt of Korean left in a code file, a file it does not name being allowed none; no code file of this
# repository holds any.
quick = ["korean", "layout", "dependencies", "cargo-profile", "shared-versions"]
korean_ledger = "korean-ledger.json"
# The base libraries, the published clients of the units the console calls (docs/boundary.md), and sumida,
# the server's base, a git dependency.
base_libraries = ["bmo-chat", "bmo-chat-client", "bmo-ui", "bmo-text", "@agency/client", "bmo-job-client", "@bmo/receiver-client", "sumida"]

# The repository whose root holds the shared versions the manifests and the lock hold to. The hyper 0.14 line the
# lock holds besides hyper 1 is sumida's S3 client's own, on a semver line the shared versions do not name.
[check.shared_versions]
repository = "bmo-chat"

# No static step is declared for the server. The testbed's own Cargo workspace check formats and lints every
# member, every target compiled, through its Cargo verb in the shared build directory, wherever a change marks a
# crate, and the change check compiles every crate a change marks; a change that marks none has no Rust to judge.

# The server's binary goes into a release's bin/.
[build]
binaries = ["bmo-web-server"]

# The console, built in the build tree, where its install and Nuxt's generated project stay warm between
# deployments, and written into the release being built: the release beside the build tree, named by the first
# twelve hex digits of the commit (the testbed's docs/deploy.md, 「The places」). A running console reads its chunks
# from the release it started from, so a build never writes over a release that serves (docs/web.md, 「Running as a
# service」). The base path is fixed as the console is built, so the build reads the console's environment from the
# data root first.
[[build.step]]
id = "console-install"
dir = "client"
command = "bun install --frozen-lockfile"

[[build.step]]
id = "console-build"
dir = "client/apps/web"
lane = "wide"
command = "set -a && . ~/.local/share/bmo/data/env/web-console.env && set +a && BMO_WEB_OUTPUT_DIR=\"$(git rev-parse --show-toplevel)/../deploy-releases/$(git rev-parse HEAD | cut -c1-12)/client/apps/web/.output\" bun run build"

# The repository's own deploy tree, and the data root it shares with the services that read its files. The
# server's settings stand under the data root as env/web.toml, which each release links to as the server's
# settings.local.toml, and the console's environment as env/web-console.env, which each release links to beside the
# console (docs/web.md, 「Running as a service」). The ports, the base path and the public name are among them, and
# none is written here.
[deploy]
root = "~/.local/share/bmo-web"
link = "deploy"
data_root = "~/.local/share/bmo/data"
env_links = [
  { link = "server/settings.local.toml", target = "env/web.toml" },
  { link = "client/apps/web/console.env", target = "env/web-console.env" }
]
# The server's unit, marked bot, whose health the deployment waits on, and the console's, marked restart.
units = ["deploy/*.service"]
# Answers 0 once the server the deployed settings name answers its health route (docs/accounts.md, 「Where it
# answers」).
health = "cd ~/.local/share/bmo-web/deploy/server && ../bin/bmo-web-server health"

# The server's settings held to what it stands on before the flip: a release is never put live on settings that
# name no token or no chat agent (docs/boundary.md, 「Settings」), since `serve` refuses to stand without either.
[[deploy.step]]
id = "settings"
phase = "before-flip"
command = "cd server && ../bin/bmo-web-server settings"

# The document wording file, written from the release's own pack into the release, where bmo-artifact's `[wording]
# file` names it through the deploy tree: ~/.local/share/bmo-web/deploy/documents.ko.yaml (docs/boundary.md, 「The
# document wording file」).
[[deploy.step]]
id = "wording"
phase = "before-flip"
command = "bin/bmo-web-server wording documents.ko.yaml"

# The server's database brought up to date before the flip; every migration only adds, so the release still serving
# reads on through it.
[[deploy.step]]
id = "migrate"
phase = "before-flip"
command = "cd server && ../bin/bmo-web-server migrate"
